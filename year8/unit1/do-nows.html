    { col:'c1', type:'Order of Operations', star:'\u2605 BIDMAS', hint:'Multiply before you add!', katexQ:'-3 + 2 \\times 5', ans:'7', note:'2 \xd7 5 = 10 first \xb7 then \u22123 + 10 = 7' },
    { col:'c2', type:'Order of Operations', star:'\u2605\u2605 BIDMAS', hint:'From your test \u2014 can you get it this time?', katexQ:'-5 + (-3) \\times 4 - 1', katexQsize:'sm', ans:'\u221218', note:'(\u22123) \xd7 4 = \u221212 first \xb7 then \u22125 + (\u221212) \u2212 1 = \u221218' },
    { col:'c3', type:'Fraction Addition', star:'\u2605\u2605 Fractions', hint:'What is LCM(6, 8)?', katexQ:'\\dfrac{5}{6} + \\dfrac{3}{8} = \\;?', katexA:'\\dfrac{29}{24} = 1\\dfrac{5}{24}', note:'LCM(6,8) = 24 \xb7 5/6 = 20/24 \xb7 3/8 = 9/24 \xb7 20 + 9 = 29' },
    { col:'c4', type:'Missing Number', star:'\u2605\u2605\u2605 Fractions + BIDMAS', hint:'BIDMAS: what must the \xd7 part equal first?', katexQ:'\\dfrac{1}{2} + \\square \\times \\dfrac{2}{3} = \\dfrac{7}{6}', katexQsize:'sm', katexA:'\\square = 1', note:'\u25a1 \xd7 2/3 = 7/6 \u2212 1/2 = 7/6 \u2212 3/6 = 4/6 = 2/3 \xb7 So \u25a1 \xd7 2/3 = 2/3 \xb7 \u25a1 = 1' },
  ]},
];

function frac(num,den){ return katex.renderToString('\\frac{'+num+'}{'+den+'}',{throwOnError:false}); }

const wrap = document.getElementById('slideWrap');

DONOWS.forEach((dn,idx)=>{
  const slide = document.createElement('div');
  slide.className = 'slide'+(idx===0?' active':'');
  slide.id = 'dn'+idx;
  const tag = document.createElement('div');
  tag.className = 'lesson-tag';
  tag.textContent = dn.lesson;
  const grid = document.createElement('div');
  grid.className = 'grid';

  dn.cards.forEach((c,ci)=>{
    const card = document.createElement('div');
    card.className = 'card '+c.col;
    const sc = c.size?' '+c.size:'';

    if(c.katexQ!==undefined){
      const qR = katex.renderToString(c.katexQ,{throwOnError:false,displayMode:false});
      const qSz = c.katexQsize==='sm'?' sm':'';
      const aR = c.katexA ? katex.renderToString(c.katexA,{throwOnError:false}) : '<span>'+c.ans+'</span>';
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="star-badge">${c.star}</div>
        <div class="q-katex${qSz}">${qR}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${aR}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.bidmas){
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="color:var(--c4-ink);font-weight:600;font-size:clamp(0.78rem,1.5vw,0.95rem);">Place each number card to make <span style="font-family:'DM Serif Display',serif;font-size:1.3em;">38</span></div>
        <div class="tile-bank" style="gap:12px;margin-top:6px;">
          <span class="tile" style="width:52px;height:52px;font-size:clamp(1.3rem,2.6vw,1.8rem);">2</span>
          <span class="tile" style="width:52px;height:52px;font-size:clamp(1.3rem,2.6vw,1.8rem);">3</span>
          <span class="tile" style="width:52px;height:52px;font-size:clamp(1.3rem,2.6vw,1.8rem);">4</span>
          <span class="tile" style="width:52px;height:52px;font-size:clamp(1.3rem,2.6vw,1.8rem);">7</span>
        </div>
        <div class="eq-row" style="gap:8px;margin-top:10px;flex:1;align-items:center;">
          <span class="eq-sep" style="font-size:clamp(1.5rem,3.2vw,2.4rem);">(</span>
          <span class="eq-box" style="width:52px;height:52px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.5rem,3.2vw,2.4rem);">+</span>
          <span class="eq-box" style="width:52px;height:52px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.5rem,3.2vw,2.4rem);">) \xd7</span>
          <span class="eq-box" style="width:52px;height:52px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.5rem,3.2vw,2.4rem);">\u2212</span>
          <span class="eq-box" style="width:52px;height:52px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.5rem,3.2vw,2.4rem);">= 38</span>
        </div>
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">One solution</div>
          <div class="ans-val" style="font-size:clamp(1rem,2vw,1.5rem)">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.bidmas2){
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="tile-bank" style="gap:12px;margin-top:8px;">
          <span class="tile" style="width:56px;height:56px;font-size:clamp(1.4rem,2.8vw,2rem);">3</span>
          <span class="tile" style="width:56px;height:56px;font-size:clamp(1.4rem,2.8vw,2rem);">4</span>
          <span class="tile" style="width:56px;height:56px;font-size:clamp(1.4rem,2.8vw,2rem);">5</span>
          <span class="tile" style="width:56px;height:56px;font-size:clamp(1.4rem,2.8vw,2rem);">8</span>
        </div>
        <div class="eq-row" style="gap:8px;margin-top:12px;flex:1;align-items:center;">
          <span class="eq-box" style="width:56px;height:56px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.6rem,3.4vw,2.6rem);">+</span>
          <span class="eq-box" style="width:56px;height:56px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.6rem,3.4vw,2.6rem);">\xd7 (</span>
          <span class="eq-box" style="width:56px;height:56px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.6rem,3.4vw,2.6rem);">\u2212</span>
          <span class="eq-box" style="width:56px;height:56px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.6rem,3.4vw,2.6rem);">) = 25</span>
        </div>
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">One solution</div>
          <div class="ans-val" style="font-size:clamp(1rem,2vw,1.5rem)">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.subqs){
      const subHTML = c.subqs.map(sq=>{
        const s1=sq.sign1||''; const s2=sq.sign2||'';
        const latex='\\left('+s1+'\\frac{'+sq.num1+'}{'+sq.den1+'}\\right) '+sq.op+' \\left('+s2+'\\frac{'+sq.num2+'}{'+sq.den2+'}\\right) = \\;?';
        const r=katex.renderToString(latex,{throwOnError:false});
        return '<div class="sub-q"><span class="sub-label">'+sq.label+'</span><span class="sub-expr">'+r+'</span></div>';
      }).join('');
      const ansHTML = c.ansFracs ? c.ansFracs.map(af=>{
        let l=''; if(af.sign)l+=af.sign;
        if(af.whole&&af.num) l+=af.whole+'\\,\\frac{'+af.num+'}{'+af.den+'}';
        else if(af.whole) l+=af.whole;
        else if(af.num) l+='\\frac{'+af.num+'}{'+af.den+'}';
        return af.label+' '+katex.renderToString(l,{throwOnError:false});
      }).join('&nbsp;&nbsp;&nbsp;&nbsp;') : c.ans;
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">${c.instr}</div>${subHTML}
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answers</div>
          <div class="ans-val" style="font-size:clamp(0.95rem,2.2vw,1.6rem)">${ansHTML}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.ordering){
      const tiles = c.fracs.map(f=>f.whole?`<span class="frac-tile">${f.whole}</span>`:`<span class="frac-tile">${frac(f.num,f.den)}</span>`).join('');
      const ansHTML = c.ansOrder ? c.ansOrder.map(af=>af.whole?katex.renderToString(af.whole,{throwOnError:false}):frac(af.num,af.den)).join(' <span style="opacity:0.5;font-size:0.85em;margin:0 4px;">&lt;</span> ') : c.ans;
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="color:var(--c3-ink);font-weight:600;font-size:clamp(0.82rem,1.6vw,1rem);">Order from smallest to largest:</div>
        <div class="frac-bank">${tiles}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val" style="font-size:clamp(0.95rem,2.2vw,1.5rem)">${ansHTML}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.instr){
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        ${c.badge?`<div class="pk-badge">${c.badge}</div>`:''}
        <div class="q-instr">${c.instr}</div>
        <div class="q-eq">${c.qtext}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div><div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        ${c.badge?`<div class="pk-badge">${c.badge}</div>`:''}
        <div class="q-text${sc}">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div><div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    }
    grid.appendChild(card);
  });
  slide.appendChild(tag); slide.appendChild(grid); wrap.appendChild(slide);
});

const slides=document.querySelectorAll('.slide'),total=slides.length;
let cur=0,showing=false;
const topSub=document.getElementById('topSub'),topLesson=document.getElementById('topLesson'),
      navInfo=document.getElementById('navInfo'),pf=document.getElementById('pf'),
      pb=document.getElementById('pb'),nb=document.getElementById('nb'),
      masterBtn=document.getElementById('masterBtn');

function update(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  topSub.textContent='Do Now '+(cur+1)+' of '+total;
  topLesson.textContent=DONOWS[cur].lesson;
  navInfo.textContent='Do Now '+(cur+1)+' of '+total;
  pf.style.width=((cur+1)/total*100)+'%';
  pb.disabled=cur===0; nb.disabled=cur===total-1;
  nb.textContent=cur===total-1?'Done \u2713':'Next \u2192';
  document.querySelectorAll('.ans-wrap').forEach(el=>el.classList.remove('on'));
  showing=false; masterBtn.textContent='Show Answers'; masterBtn.classList.remove('on');
}

function toggleAnswers(){
  showing=!showing;
  for(let ci=0;ci<4;ci++){const el=document.getElementById('a'+cur+'-'+ci);if(el)el.classList.toggle('on',showing);}
  masterBtn.textContent=showing?'Hide Answers':'Show Answers';
  masterBtn.classList.toggle('on',showing);
}

pb.onclick=()=>{if(cur>0){cur--;update();}};
nb.onclick=()=>{if(cur<total-1){cur++;update();}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<total-1){cur++;update();}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0){cur--;update();}}
});
update();
</script>
</body>
</html>
