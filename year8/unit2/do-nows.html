<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y8 · Unit 2 · Do Nows</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0ede8; --navy:#0f2044; --text:#111122; --muted:#3e3e5c;
    --c1-bg:#dff0ed; --c1-bdr:#9dd4cc; --c1-ink:#043d35;
    --c2-bg:#fdf0dc; --c2-bdr:#f0c472; --c2-ink:#4a2b00;
    --c3-bg:#e8e4f8; --c3-bdr:#b8aeed; --c3-ink:#2a1566;
    --c4-bg:#fde8e8; --c4-bdr:#f0a8a8; --c4-ink:#6a1010;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

  .topbar{background:var(--navy);color:white;height:54px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .top-left{display:flex;align-items:center;gap:16px;}
  .top-title{font-family:'DM Serif Display',serif;font-size:1.15rem;}
  .top-sub{font-size:0.78rem;opacity:0.5;letter-spacing:0.13em;text-transform:uppercase;}
  .toggle-btn{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.28);color:white;border-radius:8px;padding:7px 20px;font-size:0.88rem;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.04em;}
  .toggle-btn:hover{background:rgba(255,255,255,.22);}
  .toggle-btn.on{background:#00b4a0;border-color:#00b4a0;}

  .slides{flex:1;position:relative;overflow:auto;min-height:0;}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px 20px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s, transform .35s;overflow-y:auto;}
  .slide.active{opacity:1;transform:translateY(0);pointer-events:all;}
  .lesson-tag{font-size:0.78rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;text-align:center;}

  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;width:100%;max-width:1200px;max-height:660px;height:100%;margin:0 auto;}

  .card{border-radius:18px;padding:22px 28px;border:2.5px solid;display:flex;flex-direction:column;gap:10px;overflow:visible;position:relative;}
  .card.c1{background:var(--c1-bg);border-color:var(--c1-bdr);}
  .card.c2{background:var(--c2-bg);border-color:var(--c2-bdr);}
  .card.c3{background:var(--c3-bg);border-color:var(--c3-bdr);}
  .card.c4{background:var(--c4-bg);border-color:var(--c4-bdr);}

  .q-row{display:flex;align-items:center;gap:10px;}
  .q-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:800;color:white;flex-shrink:0;}
  .c1 .q-dot{background:var(--c1-ink);} .c2 .q-dot{background:var(--c2-ink);} .c3 .q-dot{background:var(--c3-ink);} .c4 .q-dot{background:var(--c4-ink);}
  .q-type{font-size:0.78rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:0.75;}
  .c1 .q-type{color:var(--c1-ink);} .c2 .q-type{color:var(--c2-ink);} .c3 .q-type{color:var(--c3-ink);} .c4 .q-type{color:var(--c4-ink);}

  .q-instr{font-family:'DM Sans',sans-serif;font-size:clamp(1rem,1.8vw,1.25rem);font-weight:600;line-height:1.5;margin-top:2px;}
  .c1 .q-instr{color:var(--c1-ink);} .c2 .q-instr{color:var(--c2-ink);} .c3 .q-instr{color:var(--c3-ink);} .c4 .q-instr{color:var(--c4-ink);}
  .q-eq{font-family:'DM Serif Display',serif;font-size:clamp(1.9rem,3.8vw,3.2rem);line-height:1.35;flex:1;display:flex;align-items:center;letter-spacing:0.04em;}
  .q-eq.sm{font-size:clamp(1.4rem,2.8vw,2.2rem);}
  .c1 .q-eq{color:var(--c1-ink);} .c2 .q-eq{color:var(--c2-ink);} .c3 .q-eq{color:var(--c3-ink);} .c4 .q-eq{color:var(--c4-ink);}
  .q-hint{font-size:0.92rem;color:var(--muted);font-style:italic;line-height:1.45;margin-top:-4px;}

  .q-katex{font-family:'DM Serif Display',serif;flex:1;display:flex;align-items:center;line-height:1.3;}
  .q-katex .katex{font-size:clamp(1.5rem,3.5vw,3rem);}
  .q-katex.sm .katex{font-size:clamp(1.15rem,2.6vw,2.2rem);}
  .c1 .q-katex{color:var(--c1-ink);} .c2 .q-katex{color:var(--c2-ink);} .c3 .q-katex{color:var(--c3-ink);} .c4 .q-katex{color:var(--c4-ink);}

  .q-text{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,3.8vw,3rem);line-height:1.2;flex:1;display:flex;align-items:center;}
  .q-text.sm{font-size:clamp(1.15rem,2.6vw,2rem);}
  .q-text.med{font-size:clamp(1.3rem,3vw,2.4rem);}
  .c1 .q-text{color:var(--c1-ink);} .c2 .q-text{color:var(--c2-ink);} .c3 .q-text{color:var(--c3-ink);} .c4 .q-text{color:var(--c4-ink);}

  .ans-wrap{display:none;flex-direction:column;gap:5px;border-top:2.5px dashed rgba(0,0,0,0.18);padding-top:10px;margin-top:4px;animation:fadeUp .25s ease both;}
  .ans-wrap.on{display:flex;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .ans-lbl{font-size:0.72rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;opacity:0.55;}
  .ans-val{font-family:'DM Serif Display',serif;font-size:clamp(1.4rem,3vw,2.3rem);line-height:1.2;}
  .ans-note{font-size:0.9rem;color:var(--muted);line-height:1.45;}
  .c1 .ans-val{color:var(--c1-ink);} .c2 .ans-val{color:var(--c2-ink);} .c3 .ans-val{color:var(--c3-ink);} .c4 .ans-val{color:var(--c4-ink);}

  .pbar{height:4px;background:rgba(0,0,0,.08);flex-shrink:0;}
  .pfill{height:100%;background:var(--navy);transition:width .4s;}
  .bnav{height:44px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
  .nav-info{font-size:0.7rem;color:rgba(255,255,255,.38);letter-spacing:0.12em;text-transform:uppercase;}
  .nbtns{display:flex;gap:8px;}
  .nb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;border-radius:7px;padding:6px 18px;font-size:0.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .18s;}
  .nb:hover{background:rgba(255,255,255,.2);}
  .nb:disabled{opacity:.28;cursor:default;}
  .nb.prim{background:#00b4a0;border-color:#00b4a0;color:var(--navy);font-weight:700;}

  .katex{font-size:1em;} .ans-val .katex{font-size:0.95em;} .ans-note .katex{font-size:0.82em;}
</style>
</head>
<body>

<div class="topbar">
  <div class="top-left">
    <div class="top-title">Y8 · Unit 2 Do Nows</div>
    <div class="top-sub" id="topSub">Do Now 1</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="font-size:0.68rem;opacity:.38;color:white;letter-spacing:.1em;text-transform:uppercase" id="topLesson"></div>
    <button class="toggle-btn" id="masterBtn" onclick="toggleAnswers()">Show Answers</button>
  </div>
</div>

<div class="slides" id="slideWrap"></div>

<div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
<div class="bnav">
  <div class="nav-info" id="navInfo"></div>
  <div class="nbtns">
    <button class="nb" id="pb" disabled>&larr; Back</button>
    <button class="nb prim" id="nb">Next &rarr;</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Y8 UNIT 2 DO NOW DATA
   Topics: Algebra (new) + Unit 1 recap (indices, standard form)
   ══════════════════════════════════════════════════════════════════════ */

const DONOWS = [

  // ── DO NOW 1 · Equations, Index Laws, Standard Form, Word Problem ───────
  {
    lesson: 'Algebra Begins · Mixed Review',
    cards: [
      {
        col:'c1', type:'Solve',
        instr:'Solve:',
        katexQ:'5x + 3 = 28',
        hint:'Subtract 3 first, then divide.',
        katexA:'x = 5',
        ans:'x = 5', note:'5x + 3 = 28 · 5x = 25 · x = 5'
      },
      {
        col:'c2', type:'Index Laws',
        instr:'Simplify:',
        katexQ:'\\dfrac{(2x^{4})^{3}}{4x^{5}}',
        katexQsize:'sm',
        hint:'Cube the bracket first, then divide.',
        katexA:'2x^{7}',
        ans:'2x⁷', note:'(2x⁴)³ = 8x¹² · 8x¹² ÷ 4x⁵ = 2x⁷'
      },
      {
        col:'c3', type:'Standard Form',
        instr:'Write in standard form:',
        katexQ:'0.00067',
        hint:'How many places does the decimal move?',
        katexA:'6.7 \\times 10^{-4}',
        ans:'6.7 × 10⁻⁴', note:'Decimal moves 4 places right to get 6.7 · Small number → 6.7 × 10⁻⁴'
      },
      {
        col:'c4', type:'🧩 Word Problem',
        qtext:'A phone plan has a fixed monthly charge plus $200 per GB of data. Mateo used 8 GB and his bill was $3,100. What is the fixed monthly charge?', size:'sm',
        hint:'Let x = fixed charge. Write: x + 200 × 8 = 3100',
        ans:'$1,500', note:'x + 200(8) = 3100 · x + 1600 = 3100 · x = 1500 · Check: 1500 + 1600 = 3100 ✓'
      },
    ]
  },

  // ── DO NOW 2 · Equations, Substitution, Negative Powers, Puzzle ─────────
  {
    lesson: 'Equations & Substitution',
    cards: [
      {
        col:'c1', type:'Solve',
        instr:'Solve:',
        katexQ:'3(x - 2) = 21',
        hint:'What is 21 ÷ 3? Then what?',
        katexA:'x = 9',
        ans:'x = 9', note:'3(x − 2) = 21 · x − 2 = 7 · x = 9'
      },
      {
        col:'c2', type:'Substitution',
        instr:'If  x = 6,  find:',
        katexQ:'\\dfrac{3x + 7}{5}',
        hint:'Work out the top first, then divide.',
        katexA:'5',
        ans:'5', note:'3(6) + 7 = 25 · 25 ÷ 5 = 5'
      },
      {
        col:'c3', type:'Negative Powers',
        instr:'Write as a fraction:',
        katexQ:'2^{-4}',
        hint:'Negative power → 1 over the positive power.',
        katexA:'\\dfrac{1}{16}',
        ans:'1/16', note:'2⁻⁴ = 1/2⁴ = 1/16'
      },
      {
        col:'c4', type:'🧩 Algebra Puzzle',
        qtext:'A rectangle has length (x + 4) cm and width 3 cm. Its perimeter is 26 cm. Find x.', size:'sm',
        hint:'Perimeter = 2 × (length + width). Can you write the equation?',
        ans:'x = 6', note:'2(x + 4 + 3) = 26 · x + 7 = 13 · x = 6 · Check: length = 10, width = 3, P = 2(13) = 26 ✓'
      },
    ]
  },

  // ── DO NOW 3 · Change Subject, Solve, Index Laws, BIDMAS Fractions ──────
  {
    lesson: 'Rearranging · Equations · Index Laws',
    cards: [
      {
        col:'c1', type:'Change the Subject',
        instr:'Make x the subject:',
        katexQ:'y = 2x + 7',
        hint:'Subtract 7 first, then divide by 2.',
        katexA:'x = \\dfrac{y - 7}{2}',
        ans:'x = (y−7)/2', note:'y − 7 = 2x · x = (y − 7)/2'
      },
      {
        col:'c2', type:'Solve',
        instr:'Solve:',
        katexQ:'4(2x + 1) = 3x + 19',
        katexQsize:'sm',
        hint:'Expand the bracket first.',
        katexA:'x = 3',
        ans:'x = 3', note:'8x + 4 = 3x + 19 · 5x = 15 · x = 3 · Check: 4(7) = 28, 3(3)+19 = 28 ✓'
      },
      {
        col:'c3', type:'Index Laws',
        instr:'Simplify:',
        katexQ:'(2a^{3})^{2} \\times a^{-4}',
        katexQsize:'sm',
        hint:'Square the bracket first, then add the powers.',
        katexA:'4a^{2}',
        ans:'4a²', note:'(2a³)² = 4a⁶ · 4a⁶ × a⁻⁴ = 4a⁶⁻⁴ = 4a²'
      },
      {
        col:'c4', type:'BIDMAS',
        instr:'Calculate:',
        katexQ:'\\left(\\dfrac{2}{5} + \\dfrac{3}{5}\\right) \\div \\sqrt{\\dfrac{4}{9}} + \\left(-\\dfrac{1}{6}\\right)',
        katexQsize:'sm',
        hint:'Brackets first, then the root, then ÷, then +',
        katexA:'\\dfrac{4}{3} = 1\\tfrac{1}{3}',
        ans:'4/3 = 1⅓', note:'2/5 + 3/5 = 1 · √(4/9) = 2/3 · 1 ÷ 2/3 = 3/2 · 3/2 + (−1/6) = 9/6 − 1/6 = 8/6 = 4/3'
      },
    ]
  },

  // ── DO NOW 4 · Change Subject, Solve, Roots & Negative Indices (weak areas) ─
  {
    lesson: 'Rearranging · Equations · Weak Areas Recap',
    cards: [
      {
        col:'c1', type:'Change the Subject',
        instr:'Make a the subject:',
        katexQ:'P = 4a + 3b',
        hint:'Subtract 3b first, then divide by 4.',
        katexA:'a = \\dfrac{P - 3b}{4}',
        ans:'a = (P−3b)/4', note:'P − 3b = 4a · a = (P − 3b)/4'
      },
      {
        col:'c2', type:'Solve',
        instr:'Solve:',
        katexQ:'3(2x - 5) = 21',
        katexQsize:'sm',
        hint:'Divide both sides by 3 first, or expand.',
        katexA:'x = 6',
        ans:'x = 6', note:'3(2x − 5) = 21 · 2x − 5 = 7 · 2x = 12 · x = 6 · Check: 3(12−5) = 3(7) = 21 ✓'
      },
      {
        col:'c3', type:'Roots & Negative Indices',
        instr:'Calculate each:',
        katexQ:'\\text{a)}\\;\\sqrt[3]{\\dfrac{-8}{27}} \\qquad \\text{b)}\\;\\left(\\dfrac{2}{5}\\right)^{-2}',
        katexQsize:'sm',
        hint:'a) Cube root top and bottom separately. b) Flip the fraction, then square.',
        katexA:'\\text{a)}\\;\\dfrac{-2}{3} \\qquad \\text{b)}\\;\\dfrac{25}{4}',
        ans:'a) −2/3   b) 25/4', note:'a) ∛(−8) = −2, ∛27 = 3 → −2/3 · b) Flip: (5/2)² = 25/4'
      },
      {
        col:'c4', type:'BIDMAS',
        instr:'Calculate each:',
        katexQ:'\\text{a)}\\;\\sqrt{\\dfrac{49}{16}} + \\dfrac{1}{4} \\qquad \\text{b)}\\;3 \\times 2^{-3} + \\dfrac{1}{2}',
        katexQsize:'sm',
        hint:'a) Root the top and bottom. b) Work out 2⁻³ first.',
        katexA:'\\text{a)}\\;2 \\qquad \\text{b)}\\;\\dfrac{7}{8}',
        ans:'a) 2   b) 7/8', note:'a) √49=7, √16=4 → 7/4 + 1/4 = 8/4 = 2 · b) 2⁻³ = 1/8 · 3×1/8 = 3/8 · 3/8 + 1/2 = 3/8 + 4/8 = 7/8'
      },
    ]
  },

  // ── DO NOW 5 · Change Subject, Solve, Neg Index BIDMAS, Cube Root BIDMAS ──
  {
    lesson: 'Rearranging · Equations · BIDMAS with Indices & Roots',
    cards: [
      {
        col:'c1', type:'Change the Subject',
        instr:'Make m the subject:',
        katexQ:'T = 5m - 2n',
        hint:'Add 2n first, then divide by 5.',
        katexA:'m = \\dfrac{T + 2n}{5}',
        ans:'m = (T+2n)/5', note:'T + 2n = 5m · m = (T + 2n)/5'
      },
      {
        col:'c2', type:'Solve',
        instr:'Solve:',
        katexQ:'4(3x + 2) = 56',
        hint:'Divide both sides by 4 first, or expand.',
        katexA:'x = 4',
        ans:'x = 4', note:'3x + 2 = 14 · 3x = 12 · x = 4 · Check: 4(14) = 56 ✓'
      },
      {
        col:'c3', type:'BIDMAS · Negative Index',
        instr:'Calculate:',
        katexQ:'\\left(\\dfrac{2}{3}\\right)^{-2} - \\dfrac{1}{4}',
        katexQsize:'sm',
        hint:'Flip the fraction and square it first.',
        katexA:'2',
        ans:'2', note:'(2/3)⁻² = (3/2)² = 9/4 · 9/4 − 1/4 = 8/4 = 2'
      },
      {
        col:'c4', type:'BIDMAS · Cube Root',
        instr:'Calculate:',
        katexQ:'\\sqrt[3]{\\dfrac{27}{8}} \\times \\dfrac{2}{3} - \\dfrac{1}{2}',
        katexQsize:'sm',
        hint:'Cube root top and bottom separately first.',
        katexA:'\\dfrac{1}{2}',
        ans:'1/2', note:'∛27 = 3, ∛8 = 2 → 3/2 · 3/2 × 2/3 = 1 · 1 − 1/2 = 1/2'
      },
    ]
  },

  // ── DO NOW 6 · Change Subject (square root), x both sides, neg cube root, neg index ──
  {
    lesson: 'Rearranging · Equations · Roots & Negative Indices',
    cards: [
      {
        col:'c1', type:'Change the Subject',
        instr:'Make t the subject:',
        katexQ:'S = 2t^{2}',
        hint:'Divide by 2 first. Then what undoes a square?',
        katexA:'t = \\sqrt{\\dfrac{S}{2}}',
        ans:'t = √(S/2)', note:'t² = S/2 · t = √(S/2)'
      },
      {
        col:'c2', type:'Solve',
        instr:'Solve:',
        katexQ:'3(x + 4) = 5x - 2',
        katexQsize:'sm',
        hint:'Expand the bracket, then collect x terms on one side.',
        katexA:'x = 7',
        ans:'x = 7', note:'3x + 12 = 5x − 2 · 12 + 2 = 5x − 3x · 14 = 2x · x = 7 · Check: 3(11) = 33, 5(7)−2 = 33 ✓'
      },
      {
        col:'c3', type:'BIDMAS · Negative Cube Root',
        instr:'Calculate:',
        katexQ:'\\sqrt[3]{\\dfrac{-64}{125}} + \\dfrac{3}{5}',
        katexQsize:'sm',
        hint:'Cube root the top and bottom separately. Keep the negative!',
        katexA:'-\\dfrac{1}{5}',
        ans:'−1/5', note:'∛(−64) = −4, ∛125 = 5 → −4/5 · −4/5 + 3/5 = −1/5'
      },
      {
        col:'c4', type:'BIDMAS · Negative Index',
        instr:'Calculate:',
        katexQ:'\\left(\\dfrac{5}{2}\\right)^{-2} \\times 100',
        katexQsize:'sm',
        hint:'Flip the fraction first, then square, then multiply.',
        katexA:'16',
        ans:'16', note:'(5/2)⁻² = (2/5)² = 4/25 · 4/25 × 100 = 400/25 = 16'
      },
    ]
  },

  // ── DO NOW 7 · Change Subject (fraction), Solve (x both sides), BIDMAS roots & neg indices ──
  {
    lesson: 'Rearranging · Equations · Roots & Negative Indices',
    cards: [
      {
        col:'c1', type:'Change the Subject',
        instr:'Make x the subject:',
        katexQ:'y = \\dfrac{3x + 4}{5}',
        katexQsize:'sm',
        hint:'Multiply both sides by 5 first.',
        katexA:'x = \\dfrac{5y - 4}{3}',
        ans:'x = (5y−4)/3', note:'5y = 3x + 4 · 5y − 4 = 3x · x = (5y − 4)/3'
      },
      {
        col:'c2', type:'Solve',
        instr:'Solve:',
        katexQ:'2(3x - 1) = 4x + 6',
        katexQsize:'sm',
        hint:'Expand the bracket, then collect x terms on one side.',
        katexA:'x = 4',
        ans:'x = 4', note:'6x − 2 = 4x + 6 · 2x = 8 · x = 4 · Check: 2(11) = 22, 4(4)+6 = 22 ✓'
      },
      {
        col:'c3', type:'BIDMAS · Root × Negative Index',
        instr:'Calculate:',
        katexQ:'\\sqrt{\\dfrac{81}{16}} \\times \\left(\\dfrac{3}{2}\\right)^{-2}',
        katexQsize:'sm',
        hint:'Root first, then flip and square, then multiply.',
        katexA:'1',
        ans:'1', note:'√(81/16) = 9/4 · (3/2)⁻² = (2/3)² = 4/9 · 9/4 × 4/9 = 36/36 = 1'
      },
      {
        col:'c4', type:'BIDMAS · Cube Root + Negative Index',
        instr:'Calculate:',
        katexQ:'\\sqrt[3]{\\dfrac{-27}{64}} + \\left(\\dfrac{2}{3}\\right)^{-1}',
        katexQsize:'sm',
        hint:'Cube root top and bottom. Then flip the fraction for the ⁻¹.',
        katexA:'\\dfrac{3}{4}',
        ans:'3/4', note:'∛(−27) = −3, ∛64 = 4 → −3/4 · (2/3)⁻¹ = 3/2 · −3/4 + 3/2 = −3/4 + 6/4 = 3/4'
      },
    ]
  },

  // ── DO NOW 8 · Double Brackets, Change Subject, BIDMAS, Form Equation ───────
  {
    lesson: 'Expanding · Rearranging · BIDMAS · Forming Equations',
    cards: [
      {
        col:'c1', type:'Expand',
        instr:'Expand and simplify:',
        katexQ:'(2x + 3)(x - 4)',
        hint:'Use FOIL — First, Outside, Inside, Last.',
        katexA:'2x^{2} - 5x - 12',
        ans:'2x² − 5x − 12', note:'2x·x = 2x² · 2x·(−4) = −8x · 3·x = 3x · 3·(−4) = −12 · 2x² − 8x + 3x − 12 = 2x² − 5x − 12'
      },
      {
        col:'c2', type:'Change the Subject',
        instr:'Make x the subject:',
        katexQ:'y = \\dfrac{2x - 7}{3}',
        katexQsize:'sm',
        hint:'Multiply both sides by 3 first.',
        katexA:'x = \\dfrac{3y + 7}{2}',

          <text x="234" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="700">4</text>
          <text x="302" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">5</text>
          <text x="370" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">6</text>
          <circle cx="234" cy="30" r="7" fill="#fdf0dc" stroke="#4a2b00" stroke-width="3"/>
          <line x1="227" y1="30" x2="30" y2="30" stroke="#4a2b00" stroke-width="4"/>
          <polygon points="32,24 20,30 32,36" fill="#4a2b00"/>
        </svg>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>

      setTimeout(() => {
        const el = document.getElementById('ineqAns2_'+idx);
        if(el) katex.render('x < 4', el, {throwOnError:false});
      }, 0);
    }
    // Rectangle perimeter problem — (5x-1) and (x+3), P=28
    else if (c.rectSvg2) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">The perimeter of this rectangle is 28 cm. Find x.</div>
        <svg viewBox="0 0 340 120" style="width:100%;max-width:290px;height:auto;margin:4px auto;">

          <text x="33" y="60" text-anchor="middle" font-family="DM Serif Display,serif" font-size="15" fill="#6a1010" font-weight="700" transform="rotate(-90 33 60)">(x + 3) cm</text>

          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }
    // Inequality — pick from list (≤)
    else if (c.ineqList) {
      const ineqR = katex.renderToString('x \\leq 3', {throwOnError:false});
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">From the list below, write all the numbers that satisfy:</div>
        <div class="q-katex" style="justify-content:center;">${ineqR}</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:4px 0;">
          ${[-2, 0, 1.5, 3, 4, 7].map(n => `<span style="font-family:'DM Serif Display',serif;font-size:clamp(1.2rem,2.5vw,1.8rem);background:rgba(4,61,53,0.08);border:2px solid rgba(4,61,53,0.2);border-radius:10px;padding:6px 16px;color:var(--c1-ink);font-weight:700;">${n}</span>`).join('')}
        </div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }
    // Inequality — read from number line
    else if (c.ineqNumberLine) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">Write the inequality shown on this number line:</div>
        <svg viewBox="0 0 400 70" style="width:100%;max-width:360px;height:auto;margin:8px auto;">
          <line x1="30" y1="30" x2="370" y2="30" stroke="#4a2b00" stroke-width="2.5"/>
          <line x1="30" y1="22" x2="30" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <line x1="98" y1="22" x2="98" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <line x1="166" y1="22" x2="166" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <line x1="234" y1="22" x2="234" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <line x1="302" y1="22" x2="302" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <line x1="370" y1="22" x2="370" y2="38" stroke="#4a2b00" stroke-width="2"/>
          <text x="30" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">−4</text>
          <text x="98" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">−3</text>
          <text x="166" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">−2</text>
          <text x="234" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="700">−1</text>
          <text x="302" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">0</text>
          <text x="370" y="55" text-anchor="middle" font-family="DM Sans" font-size="13" fill="#4a2b00" font-weight="600">1</text>
          <circle cx="234" cy="30" r="7" fill="#4a2b00" stroke="#4a2b00" stroke-width="2"/>
          <line x1="241" y1="30" x2="370" y2="30" stroke="#4a2b00" stroke-width="4"/>
          <polygon points="368,24 380,30 368,36" fill="#4a2b00"/>
        </svg>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val" id="ineqAns${idx}"></div>
          <div class="ans-note">${c.note}</div>
        </div>`;
      setTimeout(() => {
        const el = document.getElementById('ineqAns'+idx);
        if(el) katex.render('x \\geq -1', el, {throwOnError:false});
      }, 0);
    }
    // Triangle perimeter problem with SVG
    else if (c.triSvg) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">The perimeter of this triangle is 28 cm. Find x.</div>
        <svg viewBox="0 0 320 150" style="width:100%;max-width:280px;height:auto;margin:4px auto;">
          <polygon points="160,15 40,130 280,130" fill="none" stroke="#2a1566" stroke-width="2.5" stroke-linejoin="round"/>
          <text x="85" y="68" text-anchor="middle" font-family="DM Serif Display,serif" font-size="20" fill="#2a1566" font-weight="700" transform="rotate(-55 85 68)">(2x + 1)</text>
          <text x="238" y="68" text-anchor="middle" font-family="DM Serif Display,serif" font-size="20" fill="#2a1566" font-weight="700" transform="rotate(55 238 68)">(x + 5)</text>
          <text x="160" y="148" text-anchor="middle" font-family="DM Serif Display,serif" font-size="20" fill="#2a1566" font-weight="700">(3x − 2)</text>
        </svg>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }
    // Rectangle problem with SVG diagram
    else if (c.rectSvg) {
      const sc = c.size ? ' ' + c.size : '';
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <svg viewBox="0 0 340 120" style="width:100%;max-width:290px;height:auto;margin:4px auto;">
          <rect x="50" y="20" width="200" height="70" rx="4" fill="none" stroke="#043d35" stroke-width="2.5"/>
          <text x="150" y="15" text-anchor="middle" font-family="DM Serif Display,serif" font-size="14" fill="#043d35" font-weight="700">(2x + 4) cm</text>
          <text x="35" y="60" text-anchor="middle" font-family="DM Serif Display,serif" font-size="14" fill="#043d35" font-weight="700" transform="rotate(-90 35 60)">3 cm</text>
          <text x="150" y="62" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="11" fill="#7abab0" font-weight="600">Area = 42 cm²</text>
        </svg>
        <div class="q-instr">${c.qtext}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }
    // KaTeX question card
    else if (c.katexQ !== undefined) {
      const qR = katex.renderToString(c.katexQ, { throwOnError: false, displayMode: false });
      const qSz = c.katexQsize === 'sm' ? ' sm' : '';
      const aR = c.katexA ? katex.renderToString(c.katexA, { throwOnError: false }) : `<span>${c.ans}</span>`;
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        ${c.instr ? `<div class="q-instr">${c.instr}</div>` : ''}
        <div class="q-katex${qSz}">${qR}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${aR}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }
    // Standard text card (for word problems etc)
    else if (c.qtext !== undefined) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="flex:1;display:flex;align-items:center;">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    }

    grid.appendChild(card);
  });

  slide.appendChild(tag);
  slide.appendChild(grid);
  wrap.appendChild(slide);
});

/* ── NAVIGATION ── */
const slides = document.querySelectorAll('.slide'), total = slides.length;
let cur = 0, showing = false;
const topSub = document.getElementById('topSub'),
      topLesson = document.getElementById('topLesson'),
      navInfo = document.getElementById('navInfo'),
      pf = document.getElementById('pf'),
      pb = document.getElementById('pb'),
      nb = document.getElementById('nb'),
      masterBtn = document.getElementById('masterBtn');

function update() {
  slides.forEach((s, i) => s.classList.toggle('active', i === cur));
  topSub.textContent = 'Do Now ' + (cur + 1) + ' of ' + total;
  topLesson.textContent = DONOWS[cur].lesson;
  navInfo.textContent = 'Do Now ' + (cur + 1) + ' of ' + total;
  pf.style.width = ((cur + 1) / total * 100) + '%';
  pb.disabled = cur === 0;
  nb.disabled = cur === total - 1;
  nb.textContent = cur === total - 1 ? 'Done ✓' : 'Next →';
  document.querySelectorAll('.ans-wrap').forEach(el => el.classList.remove('on'));
  showing = false;
  masterBtn.textContent = 'Show Answers';
  masterBtn.classList.remove('on');
}

function toggleAnswers() {
  showing = !showing;
  for (let ci = 0; ci < 4; ci++) {
    const el = document.getElementById('a' + cur + '-' + ci);
    if (el) el.classList.toggle('on', showing);
  }
  masterBtn.textContent = showing ? 'Hide Answers' : 'Show Answers';
  masterBtn.classList.toggle('on', showing);
}

pb.onclick = () => { if (cur > 0) { cur--; update(); } };
nb.onclick = () => { if (cur < total - 1) { cur++; update(); } };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (cur < total - 1) { cur++; update(); } }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (cur > 0) { cur--; update(); } }
});
update();
</script>
