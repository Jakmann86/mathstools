<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y7 · Unit 1 · Do Nows 1–11</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #f0ede8;
    --navy:   #0f2044;
    --text:   #1a1a2e;
    --muted:  #6a6a8a;

    --c1-bg:  #dff0ed; --c1-bdr: #9dd4cc; --c1-ink: #0a6b5e;
    --c2-bg:  #fdf0dc; --c2-bdr: #f0c472; --c2-ink: #7a4800;
    --c3-bg:  #e8e4f8; --c3-bdr: #b8aeed; --c3-ink: #4c2ea8;
    --c4-bg:  #fde8e8; --c4-bdr: #f0a8a8; --c4-ink: #9a1f1f;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--navy);
    color: white;
    height: 50px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .top-left { display:flex; align-items:center; gap:16px; }
  .top-title { font-family:'DM Serif Display',serif; font-size:1rem; }
  .top-sub   { font-size:0.68rem; opacity:0.45; letter-spacing:0.13em; text-transform:uppercase; }
  .toggle-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.28);
    color: white;
    border-radius:8px; padding:6px 18px;
    font-size:0.78rem; font-family:'DM Sans',sans-serif; font-weight:600;
    cursor:pointer; transition:all .2s; letter-spacing:0.04em;
  }
  .toggle-btn:hover { background:rgba(255,255,255,.22); }
  .toggle-btn.on    { background:#00b4a0; border-color:#00b4a0; }

  /* ── SLIDES ── */
  .slides { flex:1; position:relative; overflow:hidden; min-height:0; }
  .slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:14px 20px;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .35s, transform .35s;
  }
  .slide.active { opacity:1; transform:translateY(0); pointer-events:all; }

  /* ── LESSON LABEL ── */
  .lesson-tag {
    font-size:0.65rem; font-weight:700; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:10px; text-align:center;
  }

  /* ── 4-CARD GRID ── */
  .grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:13px;
    width:100%; height:100%;
    max-width:1200px; max-height:640px;
    margin:0 auto;
  }

  /* ── CARD ── */
  .card {
    border-radius:18px;
    padding:20px 26px;
    border:2.5px solid;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
    position:relative;
  }

  .card.c1 { background:var(--c1-bg); border-color:var(--c1-bdr); }
  .card.c2 { background:var(--c2-bg); border-color:var(--c2-bdr); }
  .card.c3 { background:var(--c3-bg); border-color:var(--c3-bdr); }
  .card.c4 { background:var(--c4-bg); border-color:var(--c4-bdr); }

  /* ── Q NUMBER DOT ── */
  .q-row { display:flex; align-items:center; gap:9px; }
  .q-dot {
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.82rem; font-weight:800; color:white; flex-shrink:0;
  }
  .c1 .q-dot { background:var(--c1-ink); }
  .c2 .q-dot { background:var(--c2-ink); }
  .c3 .q-dot { background:var(--c3-ink); }
  .c4 .q-dot { background:var(--c4-ink); }

  .q-type {
    font-size:0.62rem; font-weight:700; letter-spacing:0.16em;
    text-transform:uppercase; opacity:0.6;
  }
  .c1 .q-type { color:var(--c1-ink); }
  .c2 .q-type { color:var(--c2-ink); }
  .c3 .q-type { color:var(--c3-ink); }
  .c4 .q-type { color:var(--c4-ink); }

  /* ── QUESTION TEXT ── */
  .q-text {
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.6rem, 3.8vw, 3rem);
    line-height:1.2;
    flex:1;
    display:flex;
    align-items:center;
  }
  .q-text.sm  { font-size:clamp(1.15rem,2.6vw,2rem); }
  .q-text.med { font-size:clamp(1.3rem,3vw,2.4rem); }

  .c1 .q-text { color:var(--c1-ink); }
  .c2 .q-text { color:var(--c2-ink); }
  .c3 .q-text { color:var(--c3-ink); }
  .c4 .q-text { color:var(--c4-ink); }

  /* ── HINT ── */
  .q-hint {
    font-size:0.76rem; color:var(--muted); font-style:italic;
    line-height:1.45; margin-top:-4px;
  }

  /* ── ANSWER ── */
  .ans-wrap {
    display:none; flex-direction:column; gap:4px;
    border-top:2px dashed rgba(0,0,0,0.13);
    padding-top:10px; margin-top:4px;
    animation:fadeUp .25s ease both;
  }
  .ans-wrap.on { display:flex; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  .ans-lbl { font-size:0.6rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; opacity:0.45; }
  .ans-val {
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.1rem,2.6vw,1.9rem);
    line-height:1.2;
  }
  .ans-note { font-size:0.74rem; color:var(--muted); line-height:1.45; }

  .c1 .ans-val { color:var(--c1-ink); }
  .c2 .ans-val { color:var(--c2-ink); }
  .c3 .ans-val { color:var(--c3-ink); }
  .c4 .ans-val { color:var(--c4-ink); }

  /* ── INSTRUCTION + EQ layout ── */
  .q-instr {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.82rem, 1.6vw, 1rem);
    color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
  }
  .q-eq {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 3.8vw, 3rem);
    line-height: 1.2;
    flex: 1;
    display: flex;
    align-items: center;
    letter-spacing: 0.06em;
  }
  .c1 .q-eq { color: var(--c1-ink); }
  .c2 .q-eq { color: var(--c2-ink); }
  .c3 .q-eq { color: var(--c3-ink); }
  .c4 .q-eq { color: var(--c4-ink); }

  sup {
    font-size: 0.55em;
    vertical-align: baseline;
    position: relative;
    top: -0.55em;
    line-height: 1;
  }

  /* ── PRIOR KNOWLEDGE BADGE ── */
  .pk-badge {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 2px 9px; border-radius: 20px;
    align-self: flex-start; opacity: 0.7;
  }
  .c1 .pk-badge { background: rgba(10,107,94,0.15); color: var(--c1-ink); }
  .c2 .pk-badge { background: rgba(122,72,0,0.12);  color: var(--c2-ink); }
  .c3 .pk-badge { background: rgba(76,46,168,0.12); color: var(--c3-ink); }
  .c4 .pk-badge { background: rgba(154,31,31,0.12); color: var(--c4-ink); }

  /* ── RECAP BADGE ── */
  .recap-badge {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.13em;
    text-transform: uppercase; padding: 2px 9px; border-radius: 20px;
    align-self: flex-start; opacity: 0.65;
  }
  .c1 .recap-badge { background: rgba(10,107,94,0.12); color: var(--c1-ink); }
  .c2 .recap-badge { background: rgba(122,72,0,0.10);  color: var(--c2-ink); }
  .c3 .recap-badge { background: rgba(76,46,168,0.10); color: var(--c3-ink); }
  .c4 .recap-badge { background: rgba(154,31,31,0.10); color: var(--c4-ink); }

  /* ── PROGRESS + NAV ── */
  .pbar  { height:4px; background:rgba(0,0,0,.08); flex-shrink:0; }
  .pfill { height:100%; background:var(--navy); transition:width .4s; }

  .bnav {
    height:44px; background:var(--navy);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; flex-shrink:0;
  }
  .nav-info { font-size:0.7rem; color:rgba(255,255,255,.38); letter-spacing:0.12em; text-transform:uppercase; }
  .nbtns { display:flex; gap:8px; }
  .nb {
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    color:white; border-radius:7px; padding:6px 18px;
    font-size:0.78rem; font-family:'DM Sans',sans-serif;
    cursor:pointer; transition:background .18s;
  }
  .nb:hover { background:rgba(255,255,255,.2); }
  .nb:disabled { opacity:.28; cursor:default; }
  .nb.prim { background:#00b4a0; border-color:#00b4a0; color:var(--navy); font-weight:700; }
</style>
</head>
<body>

<div class="topbar">
  <div class="top-left">
    <div class="top-title">Y7 · Unit 1 Do Nows</div>
    <div class="top-sub" id="topSub">Do Now 1</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="font-size:0.68rem;opacity:.38;color:white;letter-spacing:.1em;text-transform:uppercase" id="topLesson"></div>
    <button class="toggle-btn" id="masterBtn" onclick="toggleAnswers()">Show Answers</button>
  </div>
</div>

<div class="slides" id="slideWrap">
<!-- slides injected by JS -->
</div>

<div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
<div class="bnav">
  <div class="nav-info" id="navInfo">Do Now 1 of 11</div>
  <div class="nbtns">
    <button class="nb" id="pb" disabled>← Back</button>
    <button class="nb prim" id="nb">Next →</button>
  </div>
</div>

<script>
/* ████████████████████████████████████████████████████████████████████████
   ██                                                                    ██
   ██   EDITING GUIDE — everything you need to change is in this block   ██
   ██                                                                    ██
   ████████████████████████████████████████████████████████████████████████

   Each Do Now is one object inside the DONOWS array below.
   Each object has:
     lesson  — the label shown in the header bar and above the grid
     cards   — array of exactly 4 card objects (Q1 teal, Q2 amber, Q3 purple, Q4 coral/puzzle)

   Each card object has these fields:
     col     — card colour: 'c1' (teal) | 'c2' (amber) | 'c3' (purple) | 'c4' (coral)
     type    — small label shown next to the question number dot
     badge   — optional pill label, e.g. 'prior knowledge' | 'new topic' | 'recap ①' etc.
     instr   — optional small instruction line shown above the main question text
               (use this when the question needs a lead-in, e.g. "Find the missing number:")
               When instr is present the main qtext is displayed LARGE as a standalone line.
     qtext   — the question text. Supports HTML: use <sup>2</sup> for powers, ² ³ etc.
               Use \n for a line break inside a question.
     size    — optional font-size override: 'sm' (small) | 'med' (medium)
               Omit size for the default (largest). Use 'sm' for longer questions.
               Use 'med' for medium-length questions.
               Rule of thumb: if the question is a full sentence, use 'sm'.
     hint    — optional italic hint shown below the question
     ans     — the answer shown when "Show Answers" is clicked
     note    — optional small explanation shown below the answer

   RECAP TRACKING FOR THIS UNIT:
   ┌─────────────────────────────────────────────────────────────────┐
   │  Topic first taught  │  Recap ①  │  Recap ②  │  Recap ③      │
   │  DN4  Divisibility   │  DN5      │  DN6      │  DN7           │
   │  DN5  Multiples/Fac  │  DN6      │  DN7      │  DN8           │
   │  DN6  Primes         │  DN7      │  DN8      │  (in DN8 Q3)   │
   │  DN7  Prime Fact.    │  DN8      │  DN9      │  DN10          │
   │  DN8  LCM & HCF      │  DN9      │  DN10     │  DN11          │
   │  DN9  Powers         │  DN10     │  DN11     │  —             │
   │  DN10 Roots          │  DN11     │  —        │  —             │
   └─────────────────────────────────────────────────────────────────┘
   Recaps increase in difficulty: ① easy recall → ② applied → ③ harder/extended

   TO ADD A NEW DO NOW: copy any existing block and paste it at the end of the array
   (before the final ]; ) then update the lesson name and cards.

   TO CHANGE A QUESTION: find the Do Now number in the comments below,
   then edit qtext, ans, note, size etc. as needed. Nothing else needs touching.

   ████████████████████████████████████████████████████████████████████████
   ██            DO NOT EDIT ANYTHING BELOW THE DONOWS ARRAY             ██
   ████████████████████████████████████████████████████████████████████████ */

const DONOWS = [

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 1 of 11 · Prior Knowledge · Times Tables & Division
  // All 3 prior-knowledge cards use the missing-number format.
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Prior Knowledge · Times Tables & Division',
    cards: [
      { // Q1 — missing multiplication
        col:'c1', type:'Times Tables', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? × 8 = 56',
        ans:'7', note:'7 × 8 = 56 · Check: 56 ÷ 8 = 7 ✓'
      },
      { // Q2 — missing dividend
        col:'c2', type:'Division', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? ÷ 7 = 9',
        ans:'63', note:'63 ÷ 7 = 9 · Think: 7 × 9 = 63'
      },
      { // Q3 — missing divisor
        col:'c3', type:'Times Tables', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'72 ÷ ? = 8',
        ans:'9', note:'72 ÷ 8 = 9 · Think: 8 × 9 = 72'
      },
      { // Q4 — puzzle (always coral c4)
        col:'c4', type:'🧩 Puzzle',
        qtext:'I am a number. Multiply me by 6, then add 4. The answer is 40. What am I?', size:'sm',
        ans:'6', note:'Work backwards: 40 − 4 = 36 · 36 ÷ 6 = 6'
      },
    ]
  },

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 2 of 11 · Prior Knowledge · Factors & Arithmetic
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Prior Knowledge · Factors & Arithmetic',
    cards: [
      { // Q1 — missing multiplication
        col:'c1', type:'Factors', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? × 9 = 63',
        ans:'7', note:'7 × 9 = 63 · 63 is in the 9-times table'
      },
      { // Q2 — list factors
        col:'c2', type:'Factors', badge:'prior knowledge',
        instr:'List all factors of:',
        qtext:'24',
        ans:'1, 2, 3, 4, 6, 8, 12, 24', note:'Factor pairs: 1×24, 2×12, 3×8, 4×6'
      },
      { // Q3 — missing divisor
        col:'c3', type:'Missing Number', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'48 ÷ ? = 6',
        ans:'8', note:'48 ÷ 6 = 8 · Think: 6 × 8 = 48'
      },
      { // Q4 — puzzle
        col:'c4', type:'🧩 Puzzle',
        qtext:'I have exactly 3 factors. I am less than 30. What could I be? Find all possibilities.', size:'sm',
        ans:'4, 9, 25', note:'Numbers with exactly 3 factors are squares of primes: 2²=4, 3²=9, 5²=25'
      },
    ]
  },

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 3 of 11 · Prior Knowledge · Mixed Arithmetic
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Prior Knowledge · Mixed Arithmetic',
    cards: [
      { // Q1 — missing multiplication
        col:'c1', type:'Missing Number', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? × 12 = 84',
        ans:'7', note:'7 × 12 = 84 · Check: 84 ÷ 12 = 7 ✓'
      },
      { // Q2 — list factors
        col:'c2', type:'Factors', badge:'prior knowledge',
        instr:'List all factors of:',
        qtext:'36',
        ans:'1, 2, 3, 4, 6, 9, 12, 18, 36', note:'Factor pairs: 1×36, 2×18, 3×12, 4×9, 6×6'
      },
      { // Q3 — missing dividend
        col:'c3', type:'Missing Number', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? ÷ 8 = 11',
        ans:'88', note:'8 × 11 = 88 · Check: 88 ÷ 8 = 11 ✓'
      },
      { // Q4 — puzzle
        col:'c4', type:'🧩 Puzzle',
        qtext:'Place the digits 2, 3, 4 and 6 in the boxes to make the largest possible answer:\n? × ? + ? × ?', size:'sm',
        ans:'6 × 4 + 3 × 2 = 30', note:'Largest: 6×4=24, 3×2=6, total=30 · Try others to confirm'
      },
    ]
  },

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 4 of 11 · Lesson 1 · Divisibility Rules  [NEW TOPIC]
  // Q1–Q2: divisibility (new). Q3: prior knowledge filler. Q4: puzzle.
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Lesson 1 · Divisibility Rules',
    cards: [
      { // Q1 — new topic: divisibility by 4 (rule: last 2 digits)
        col:'c1', type:'Divisibility', badge:'new topic',
        qtext:'Is 348 divisible by 4?', size:'sm',
        ans:'Yes', note:'Check last 2 digits: 48 ÷ 4 = 12 ✓ · Rule: if the last 2 digits divide by 4, the whole number does too'
      },
      { // Q2 — new topic: divisibility by 9 (digit sum rule)
        col:'c2', type:'Divisibility',
        instr:'Without dividing, is this number divisible by 9?',
        qtext:'7 2 9',
        hint:'Add the digits together',
        ans:'Yes', note:'7 + 2 + 9 = 18 · 18 ÷ 9 = 2 ✓ · Rule: sum of digits divisible by 9'
      },
      { // Q3 — prior knowledge filler (drops after DN5)
        col:'c3', type:'Prior Knowledge', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? × 7 = 91',
        ans:'13', note:'91 ÷ 7 = 13 · Check: 7 × 13 = 91 ✓'
      },
      { // Q4 — puzzle: find missing digit using divisibility by 3
        col:'c4', type:'🧩 Puzzle',
        qtext:'The number 3_2 is divisible by 3. What digit could go in the blank? Find all possibilities.', size:'sm',
        ans:'1, 4, 7', note:'3 + ? + 2 must be divisible by 3 · 5+1=6 ✓, 5+4=9 ✓, 5+7=12 ✓'
      },
    ]
  },

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 5 of 11 · Lesson 2 · Multiples & Factors  [NEW TOPIC]
  // Q1: multiples/factors (new). Q2: divisibility recap ① (easy). Q3: prior knowledge. Q4: puzzle.
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Lesson 2 · Multiples & Factors',
    cards: [
      { // Q1 — new topic: listing multiples
        col:'c1', type:'Multiples',
        qtext:'List the first 5 multiples of 7', size:'med',
        ans:'7, 14, 21, 28, 35', note:'7×1, 7×2, 7×3, 7×4, 7×5'
      },
      { // Q2 — DIVISIBILITY recap ① (easy: apply two rules together)
        col:'c2', type:'Divisibility', badge:'recap ①',
        instr:'Without dividing, is this number divisible by 6?',
        qtext:'2 5 2',
        hint:'Check for both 2 and 3',
        ans:'Yes', note:'Divisible by 2 (even) ✓ · 2+5+2=9, divisible by 3 ✓ · So divisible by 6'
      },
      { // Q3 — prior knowledge filler
        col:'c3', type:'Prior Knowledge', badge:'prior knowledge',
        instr:'Find the missing number:',
        qtext:'? ÷ 9 = 8',
        ans:'72', note:'9 × 8 = 72 · Check: 72 ÷ 9 = 8 ✓'
      },
      { // Q4 — puzzle: smallest common multiple above 100
        col:'c4', type:'🧩 Puzzle',
        qtext:'What is the smallest number greater than 100 that is a multiple of both 4 and 6?', size:'sm',
        ans:'108', note:'Multiples of 4: 100,104,108… · Multiples of 6: 102,108… · First common: 108'
      },
    ]
  },

  // ════════════════════════════════════════════════════════════════════════
  // DO NOW 6 of 11 · Lesson 3 · Primes & Composites  [NEW TOPIC]
  // Q1: primes (new). Q2: divisibility recap ② (applied). Q3: multiples recap ①. Q4: puzzle.
  // ════════════════════════════════════════════════════════════════════════
  {
    lesson: 'Lesson 3 · Primes & Composites',
    cards: [
      { // Q1 — new topic: prime checking (trial division up to √n)
        col:'c1', type:'Primes',
        qtext:'Is 97 a prime number?', size:'med',
        hint:'Check divisibility by primes up to √97 ≈ 10',
        ans:'Yes', note:'Not divisible by 2, 3, 5, 7 · So 97 is prime'
      },
      { // Q2 — DIVISIBILITY recap ② (applied: pick which are divisible by 8)
        col:'c2', type:'Divisibility', badge:'recap ②',
        instr:'Which of these is divisible by 8?',
        qtext:'312    408    524',
        hint:'Check the last 3 digits',
        ans:'312 and 408', note:'312 ÷ 8 = 39 ✓ · 408 ÷ 8 = 51 ✓ · 524 ÷ 8 = 65.5 ✗'
      },
      { // Q3 — MULTIPLES recap ① (easy: find a common multiple)
        col:'c3', type:'Multiples', badge:'recap ①',
        qtext:'Find a common multiple of 4 and 10 that is less than 50', size:'sm',
        ans:'20 or 40', note:'Multiples of 4: 4,8,12,16,20… · Multiples of 10: 10,20,30,40… · Common: 20, 40'
      },
      { // Q4 — puzzle: twin primes
        col:'c4', type:'🧩 Puzzle',
        qtext:'Twin primes are pairs of primes that differ by 2. Find all twin prime pairs below 30.', size:'sm',
        ans:'(3,5) (5,7) (11,13) (17,19) (29,31)', note:'29,31 straddles 30 but 29 < 30 so counts!'
      },

const wrap = document.getElementById('slideWrap');

DONOWS.forEach((dn, idx) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (idx === 0 ? ' active' : '');
  slide.id = 'dn' + idx;

  const tag = document.createElement('div');
  tag.className = 'lesson-tag';
  tag.textContent = dn.lesson;

  const grid = document.createElement('div');
  grid.className = 'grid';

  dn.cards.forEach((c, ci) => {
    const card = document.createElement('div');
    card.className = 'card ' + c.col;
    const sizeClass = c.size ? ' ' + c.size : '';

    if (c.instr) {
      card.innerHTML = `
        <div class="q-row">
          <div class="q-dot">${ci + 1}</div>
          <div class="q-type">${c.type}</div>
        </div>
        ${c.badge ? `<div class="pk-badge">${c.badge}</div>` : ''}
        <div class="q-instr">${c.instr}</div>
        <div class="q-eq">${c.qtext}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note ? `<div class="ans-note">${c.note}</div>` : ''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="q-row">
          <div class="q-dot">${ci + 1}</div>
          <div class="q-type">${c.type}</div>
        </div>
        ${c.badge ? `<div class="pk-badge">${c.badge}</div>` : ''}
        <div class="q-text${sizeClass}">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note ? `<div class="ans-note">${c.note}</div>` : ''}
        </div>`;
    }
    grid.appendChild(card);
  });

  slide.appendChild(tag);
  slide.appendChild(grid);
  wrap.appendChild(slide);
});

const slides   = document.querySelectorAll('.slide');
const total    = slides.length;
let cur        = 0;
let showing    = false;

const topSub    = document.getElementById('topSub');
const topLesson = document.getElementById('topLesson');
const navInfo   = document.getElementById('navInfo');
const pf        = document.getElementById('pf');
const pb        = document.getElementById('pb');
const nb        = document.getElementById('nb');
const masterBtn = document.getElementById('masterBtn');

function update() {
  slides.forEach((s,i) => s.classList.toggle('active', i===cur));
  topSub.textContent    = `Do Now ${cur+1} of ${total}`;
  topLesson.textContent = DONOWS[cur].lesson;
  navInfo.textContent   = `Do Now ${cur+1} of ${total}`;
  pf.style.width        = ((cur+1)/total*100) + '%';
  pb.disabled = cur===0;
  nb.disabled = cur===total-1;
  nb.textContent = cur===total-1 ? 'Done ✓' : 'Next →';
  hideAll();
  showing = false;
  masterBtn.textContent = 'Show Answers';
  masterBtn.classList.remove('on');
}

function hideAll() {
  document.querySelectorAll('.ans-wrap').forEach(el => el.classList.remove('on'));
}

function toggleAnswers() {
  showing = !showing;
  for(let ci=0; ci<4; ci++) {
    const el = document.getElementById(`a${cur}-${ci}`);
    if(el) el.classList.toggle('on', showing);
  }
  masterBtn.textContent = showing ? 'Hide Answers' : 'Show Answers';
  masterBtn.classList.toggle('on', showing);
}

pb.onclick = () => { if(cur>0){cur--;update();} };
nb.onclick = () => { if(cur<total-1){cur++;update();} };

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<total-1){cur++;update();}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0){cur--;update();}}
});

update();
</script>
