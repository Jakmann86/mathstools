<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y9 · Unit 1 · Do Nows 1–11</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg:     #f0ede8;
    --navy:   #0f2044;
    --text:   #1a1a2e;
    --muted:  #6a6a8a;

    --c1-bg:  #dff0ed; --c1-bdr: #9dd4cc; --c1-ink: #0a6b5e;
    --c2-bg:  #fdf0dc; --c2-bdr: #f0c472; --c2-ink: #7a4800;
    --c3-bg:  #e8e4f8; --c3-bdr: #b8aeed; --c3-ink: #4c2ea8;
    --c4-bg:  #fde8e8; --c4-bdr: #f0a8a8; --c4-ink: #9a1f1f;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--navy);
    color: white;
    height: 50px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .top-left { display:flex; align-items:center; gap:16px; }
  .top-title { font-family:'DM Serif Display',serif; font-size:1rem; }
  .top-sub   { font-size:0.68rem; opacity:0.45; letter-spacing:0.13em; text-transform:uppercase; }
  .toggle-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.28);
    color: white;
    border-radius:8px; padding:6px 18px;
    font-size:0.78rem; font-family:'DM Sans',sans-serif; font-weight:600;
    cursor:pointer; transition:all .2s; letter-spacing:0.04em;
  }
  .toggle-btn:hover { background:rgba(255,255,255,.22); }
  .toggle-btn.on    { background:#00b4a0; border-color:#00b4a0; }

  /* ── SLIDES ── */
  .slides { flex:1; position:relative; overflow:hidden; min-height:0; }
  .slide {
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:14px 20px;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .35s, transform .35s;
  }
  .slide.active { opacity:1; transform:translateY(0); pointer-events:all; }

  /* ── LESSON LABEL ── */
  .lesson-tag {
    font-size:0.65rem; font-weight:700; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:10px; text-align:center;
  }

  /* ── 4-CARD GRID ── */
  .grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:13px;
    width:100%; height:100%;
    max-width:1200px; max-height:640px;
    margin:0 auto;
  }

  /* ── CARD ── */
  .card {
    border-radius:18px;
    padding:20px 26px;
    border:2.5px solid;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
    position:relative;
  }

  .card.c1 { background:var(--c1-bg); border-color:var(--c1-bdr); }
  .card.c2 { background:var(--c2-bg); border-color:var(--c2-bdr); }
  .card.c3 { background:var(--c3-bg); border-color:var(--c3-bdr); }
  .card.c4 { background:var(--c4-bg); border-color:var(--c4-bdr); }

  /* ── Q NUMBER DOT ── */
  .q-row { display:flex; align-items:center; gap:9px; }
  .q-dot {
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.82rem; font-weight:800; color:white; flex-shrink:0;
  }
  .c1 .q-dot { background:var(--c1-ink); }
  .c2 .q-dot { background:var(--c2-ink); }
  .c3 .q-dot { background:var(--c3-ink); }
  .c4 .q-dot { background:var(--c4-ink); }

  .q-type {
    font-size:0.62rem; font-weight:700; letter-spacing:0.16em;
    text-transform:uppercase; opacity:0.6;
  }
  .c1 .q-type { color:var(--c1-ink); }
  .c2 .q-type { color:var(--c2-ink); }
  .c3 .q-type { color:var(--c3-ink); }
  .c4 .q-type { color:var(--c4-ink); }

  /* ── QUESTION TEXT ── */
  .q-text {
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.6rem, 3.8vw, 3rem);
    line-height:1.2;
    flex:1;
    display:flex;
    align-items:center;
  }
  /* slightly smaller for longer questions */
  .q-text.sm  { font-size:clamp(1.15rem,2.6vw,2rem); }
  .q-text.med { font-size:clamp(1.3rem,3vw,2.4rem); }

  .c1 .q-text { color:var(--c1-ink); }
  .c2 .q-text { color:var(--c2-ink); }
  .c3 .q-text { color:var(--c3-ink); }
  .c4 .q-text { color:var(--c4-ink); }

  /* ── HINT ── */
  .q-hint {
    font-size:0.76rem; color:var(--muted); font-style:italic;
    line-height:1.45; margin-top:-4px;
  }

  /* ── ANSWER ── */
  .ans-wrap {
    display:none; flex-direction:column; gap:4px;
    border-top:2px dashed rgba(0,0,0,0.13);
    padding-top:10px; margin-top:4px;
    animation:fadeUp .25s ease both;
  }
  .ans-wrap.on { display:flex; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  .ans-lbl { font-size:0.6rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; opacity:0.45; }
  .ans-val {
    font-family:'DM Serif Display',serif;
    font-size:clamp(1.1rem,2.6vw,1.9rem);
    line-height:1.2;
  }
  .ans-note { font-size:0.74rem; color:var(--muted); line-height:1.45; }

  .c1 .ans-val { color:var(--c1-ink); }
  .c2 .ans-val { color:var(--c2-ink); }
  .c3 .ans-val { color:var(--c3-ink); }
  .c4 .ans-val { color:var(--c4-ink); }

  /* ── EQUATION LINE (place-the-numbers) ── */
  .eq {
    display: block;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }
  /* Two-part card: small instruction + big equation on its own line */
  .q-instr {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.82rem, 1.6vw, 1rem);
    color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
  }
  .q-eq {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 3.8vw, 3rem);
    line-height: 1.2;
    flex: 1;
    display: flex;
    align-items: center;
    letter-spacing: 0.06em;
  }
  .c1 .q-eq { color: var(--c1-ink); }
  .c2 .q-eq { color: var(--c2-ink); }
  .c3 .q-eq { color: var(--c3-ink); }
  .c4 .q-eq { color: var(--c4-ink); }

  /* ── SUPERSCRIPTS ── */
  sup {
    font-size: 0.55em;
    vertical-align: baseline;
    position: relative;
    top: -0.55em;
    line-height: 1;
  }

  /* ── SPECIAL CARD STYLE (DN4 cube roots) ── */
  .card.special {
    border-radius: 20px;
    padding: 28px 32px;
    gap: 12px;
  }
  .card.special .q-text {
    font-size: clamp(2rem, 4.5vw, 3.8rem);
    flex: 1;
    display: flex;
    align-items: center;
  }
  .card.special .q-text.sm  { font-size: clamp(1.3rem, 2.8vw, 2.2rem); }
  .card.special .q-text.med { font-size: clamp(1.5rem, 3.2vw, 2.6rem); }
  .topic-label {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    padding: 3px 10px;
    border-radius: 20px;
    align-self: flex-start;
    opacity: 0.75;
  }
  .c1 .topic-label { background: rgba(10,107,94,0.15);  color: var(--c1-ink); }
  .c2 .topic-label { background: rgba(122,72,0,0.12);   color: var(--c2-ink); }
  .c3 .topic-label { background: rgba(76,46,168,0.12);  color: var(--c3-ink); }
  .c4 .topic-label { background: rgba(154,31,31,0.12);  color: var(--c4-ink); }
  .card.special .ans-wrap .ans-val { font-size: clamp(1.4rem, 3vw, 2.2rem); }

  /* ── PROGRESS + NAV ── */
  .pbar  { height:4px; background:rgba(0,0,0,.08); flex-shrink:0; }
  .pfill { height:100%; background:var(--navy); transition:width .4s; }

  .bnav {
    height:44px; background:var(--navy);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; flex-shrink:0;
  }
  .nav-info { font-size:0.7rem; color:rgba(255,255,255,.38); letter-spacing:0.12em; text-transform:uppercase; }
  .nbtns { display:flex; gap:8px; }
  .nb {
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    color:white; border-radius:7px; padding:6px 18px;
    font-size:0.78rem; font-family:'DM Sans',sans-serif;
    cursor:pointer; transition:background .18s;
  }
  .nb:hover { background:rgba(255,255,255,.2); }
  .nb:disabled { opacity:.28; cursor:default; }
  .nb.prim { background:#00b4a0; border-color:#00b4a0; color:var(--navy); font-weight:700; }

  /* ── KATEX STYLING ── */
  .katex { font-size: 0.85em; }
  .q-text .katex { font-size: 0.9em; }
  .q-text.sm .katex { font-size: 0.75em; }
  .ans-val .katex { font-size: 0.85em; }
  .ans-note .katex { font-size: 0.75em; }
</style>
</head>
<body>

<div class="topbar">
  <div class="top-left">
    <div class="top-title">Y9 · Unit 1 Do Nows</div>
    <div class="top-sub" id="topSub">Do Now 1</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="font-size:0.68rem;opacity:.38;color:white;letter-spacing:.1em;text-transform:uppercase" id="topLesson"></div>
    <button class="toggle-btn" id="masterBtn" onclick="toggleAnswers()">Show Answers</button>
  </div>
</div>

<div class="slides" id="slideWrap">
<!-- slides injected by JS -->
</div>

<div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
<div class="bnav">
  <div class="nav-info" id="navInfo">Do Now 1 of 11</div>
  <div class="nbtns">
    <button class="nb" id="pb" disabled>← Back</button>
    <button class="nb prim" id="nb">Next →</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   DO NOW DATA — 11 slides
   Card colours: c1=teal, c2=amber, c3=purple, c4=coral(always puzzle)
   BODMAS fades: Do Nows 1-3 have BODMAS (c3), replaced by topic from DN4
══════════════════════════════════════════ */

const DONOWS = [

  // ── DO NOW 1 · Lesson 1: Powers review ──────────────────────────────
  {
    lesson: 'Lesson 1 · Powers Review',
    cards: [
      {
        col:'c1', type:'Recall', qtext:'3<sup>4</sup> = ?',
        ans:'81', note:'3 × 3 × 3 × 3 = 81'
      },
      {
        col:'c2', type:'Powers', qtext:'5<sup>2</sup> × 5<sup>3</sup> = ?',
        ans:'5<sup>5</sup> = 3125', note:'Same base → add the exponents: 2 + 3 = 5'
      },
      {
        col:'c3', type:'Add Brackets', qtext:'Add one pair of brackets to make this true:<br>3 + 4 × 5 − 1 = 34', size:'sm',
        hint:'Where do the brackets go?',
        ans:'(3 + 4) × 5 − 1 = 34', note:'7 × 5 − 1 = 35 − 1 = 34 ✓'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'A bacteria doubles every hour. Starting with 1 at noon — how many at 6pm?', size:'sm',
        ans:'64', note:'2<sup>6</sup> = 64 · Each hour ×2, so after 6 hours = 2<sup>6</sup>'
      },
    ]
  },

  // ── DO NOW 2 · Lesson 2: Fractional exponents ───────────────────────
  {
    lesson: 'Lesson 2 · Fractional Exponents',
    cards: [
      {
        col:'c1', type:'Recall', qtext:'2<sup>0</sup> = ?',
        ans:'1', note:'Any non-zero base to the power 0 equals 1'
      },
      {
        col:'c2', type:'Indices', qtext:'64<sup>½</sup> = ?',
        ans:'8', note:'The ½ power means square root: √64 = 8'
      },
      {
        col:'c3', type:'Place the Numbers',
        instr:'Place 2, 3 and 5 in the boxes — each number once:',
        qtext:'☐ + ☐<sup>2</sup> × ☐ = 47',
        hint:'Which number works as the power?',
        ans:'2 + 3<sup>2</sup> × 5 = 47', note:'3<sup>2</sup> = 9 · 9 × 5 = 45 · 45 + 2 = 47 ✓'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'Use 2, 3, 4, 5 once each to make 17', size:'sm',
        ans:'e.g. 5 × 4 − 3 = 17', note:'Other solutions exist! Discuss as a class.'
      },
    ]
  },

  // ── DO NOW 3 · Lesson 3: Exponential equations ──────────────────────
  {
    lesson: 'Lesson 3 · Exponential Equations',
    cards: [
      {
        col:'c1', type:'Recall', qtext:'Write 27 as a power of 3',
        ans:'3<sup>3</sup>', note:'3 × 3 × 3 = 27, so 27 = 3<sup>3</sup>'
      },
      {
        col:'c2', type:'Indices', qtext:'8<sup>2/3</sup> = ?',
        ans:'4', note:'Cube root of 8 = 2, then 2<sup>2</sup> = 4'
      },
      {
        col:'c3', type:'Add Brackets', qtext:'Add one pair of brackets to make this true:<br>10 − 2 × 3 + 1 = 25', size:'sm',
        hint:'Where do the brackets change things?',
        ans:'(10 − 2) × 3 + 1 = 25', note:'8 × 3 + 1 = 24 + 1 = 25 ✓'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'A population triples each year, starting at 100. In how many years does it first exceed 10 000?', size:'sm',
        ans:'5 years', note:'×3 each year: 300 → 900 → 2700 → 8100 → 24300 > 10 000 ✓'
      },
    ]
  },

  // ── DO NOW 4 · Cube Roots & BODMAS (special full-card style) ──────────
  {
    lesson: 'Lesson 3–4 · Cube Roots & BODMAS',
    special: true,
    cards: [
      {
        col:'c1', type:'Cube Root', label:'∛ Indices',
        qtext:'∛125 = ?',
        ans:'5', note:'Because 5 × 5 × 5 = 125'
      },
      {
        col:'c2', type:'Negative Cube Root', label:'∛ Indices',
        qtext:'∛(−27) = ?',
        hint:'Can you cube root a negative number?',
        ans:'−3', note:'(−3)³ = −27 ✓ · Unlike square roots, cube roots of negatives are real.'
      },
      {
        col:'c3', type:'BODMAS', label:'★★ Order of Operations',
        qtext:'(−14 − ∛(−64)) ÷ 5 − √36 = ?', size:'med',
        ans:'−8', note:'∛(−64)=−4 · (−14+4)=−10 · −10÷5=−2 · −2−6=−8'
      },
      {
        col:'c4', type:'Number Puzzle', label:'🧩 Puzzle',
        qtext:'Use 2, 3, 4 and 5 once each.<br>Make 29.', size:'med',
        hint:'Use + − × ÷ and brackets in any order',
        ans:'e.g. 4 × 5 + 3² = 29', note:'Other solutions exist! · Can anyone find another way?'
      },
    ]
  },

  // ── DO NOW 5 · Lesson 4: Scientific notation ────────────────────────
  {
    lesson: 'Lesson 4 · Scientific Notation',
    cards: [
      {
        col:'c1', type:'Recall', qtext:'9<sup>x</sup> = 81 — find x', size:'med',
        ans:'x = 2', note:'9<sup>2</sup> = 81, so x = 2'
      },
      {
        col:'c2', type:'Sci. Notation', qtext:'Write 0.000045 in scientific notation', size:'sm',
        ans:'4.5 × 10⁻⁵', note:'Move decimal 5 places right → negative power of 10'
      },
      {
        col:'c3', type:'Sci. Notation', qtext:'Write 6.3 × 10⁴ as an ordinary number', size:'sm',
        ans:'63 000', note:'Move decimal 4 places right'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'Light travels at 3×10⁸ m/s. How far does it travel in 1 minute? Give your answer in sci. notation.', size:'sm',
        ans:'1.8 × 10¹⁰ m', note:'60 × 3×10⁸ = 180×10⁸ = 1.8×10¹⁰'
      },
    ]
  },

  // ── DO NOW 6 · Lesson 5: Intro to surds ─────────────────────────────
  {
    lesson: 'Lesson 5 · Intro to Surds',
    cards: [
      {
        col:'c1', type:'Sci. Notation', qtext:'Estimate 4×10³ × 5×10²', size:'med',
        ans:'2 × 10⁶', note:'4×5=20, 10³×10²=10⁵, so 20×10⁵=2×10⁶'
      },
      {
        col:'c2', type:'Surds', qtext:'Is √16 rational or irrational?', size:'med',
        ans:'Rational', note:'√16 = 4, a whole number — perfect square roots are rational'
      },
      {
        col:'c3', type:'Surds', qtext:'Between which two integers does √30 lie?', size:'sm',
        ans:'5 and 6', note:'√25=5 and √36=6, and 25 < 30 < 36'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'A right triangle has both legs equal to 1. What is the exact hypotenuse?', size:'sm',
        ans:'√2', note:'Pythagoras: 1² + 1² = 2, so hypotenuse = √2 — an irrational number!'
      },
    ]
  },

  // ── DO NOW 7 · Lesson 6: Simplifying surds / like surds ─────────────
  {
    lesson: 'Lesson 6 · Simplifying & Like Surds',
    cards: [
      {
        col:'c1', type:'Sci. Notation', qtext:'(3×10⁵) ÷ (6×10²)', size:'med',
        ans:'5 × 10²', note:'3÷6=0.5 · 10⁵÷10²=10³ · 0.5×10³=5×10²'
      },
      {
        col:'c2', type:'Surds', qtext:'Simplify √48', size:'med',
        ans:'4√3', note:'√48 = √(16×3) = √16 × √3 = 4√3'
      },
      {
        col:'c3', type:'Like Surds', qtext:'Are 5√3 and 3√5 "like surds"?', size:'sm',
        ans:'No', note:'Like surds must have the same number under the root. √3 ≠ √5'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'Arrange four copies of √3 using +, −, ×, ÷ to make a whole number. Find two ways.', size:'sm',
        ans:'√3 × √3 = 3 · √3 × √3 × √3 × √3 = 9', note:'Any arrangement that gives an integer counts!'
      },
    ]
  },

  // ── DO NOW 8 · Lesson 7: Rationalising denominators ─────────────────
  {
    lesson: 'Lesson 7 · Rationalising Denominators',
    cards: [
      {
        col:'c1', type:'Surds', qtext:'Simplify √75 − √12', size:'med',
        ans:'3√3', note:'√75=5√3 · √12=2√3 · 5√3−2√3=3√3'
      },
      {
        col:'c2', type:'Surds', qtext:'(√3)² = ?', size:'med',
        ans:'3', note:'√3 × √3 = 3 by definition. In general, (√n)² = n'
      },
      {
        col:'c3', type:'Algebra', qtext:'Expand (a + b)(a − b)', size:'med',
        ans:'a² − b²', note:'Difference of two squares — key for rationalising binomial denominators'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'Why might a mathematician prefer √2/2 over 1/√2? They are equal — what is better about the first form?', size:'sm',
        ans:'No irrational in the denominator', note:'1/√2 = √2/2 after rationalising. Irrational denominators are considered "unfinished" form.'
      },
    ]
  },

  // ── DO NOW 9 · Lesson 8: Mixed review ────────────────────────────────
  {
    lesson: 'Lesson 8 · Mixed Review',
    cards: [
      {
        col:'c1', type:'Rationalise', qtext:'Rationalise: 5/√5', size:'med',
        ans:'√5', note:'Multiply top & bottom by √5: 5√5/(√5×√5) = 5√5/5 = √5'
      },
      {
        col:'c2', type:'Exponents', qtext:'Simplify: (x³)² ÷ x⁴', size:'med',
        ans:'x²', note:'(x³)² = x⁶ · x⁶÷x⁴ = x²'
      },
      {
        col:'c3', type:'Surds', qtext:'Simplify: 2√3 × 3√3', size:'med',
        ans:'18', note:'2×3=6 · √3×√3=3 · 6×3=18'
      },
      {
        col:'c4', type:'🧩 Puzzle', qtext:'I am thinking of a number. My square is 3 more than twice my value. What am I? (There are two answers.)', size:'sm',
        ans:'x = 3 or x = −1', note:'x² = 2x+3 → x²−2x−3=0 → (x−3)(x+1)=0'
      },
    ]
  },

  // ── DO NOW 10 · Rational Numbers: Fractions warm-up ─────────────────
  {
    lesson: 'Rational Numbers · Fractions Review',
    cards: [
      {
        col:'c1', type:'Classify', qtext:'Write one number that is rational but NOT an integer',
        ans:'e.g. ½, 0.3, −¾', note:'Any fraction or terminating/recurring decimal that is not whole'
      },
      {
        col:'c2', type:'Convert', qtext:'Write 0.35 as a fraction in its simplest form',
        ans:'7/20', note:'0.35 = 35/100 · HCF(35,100) = 5 · → 7/20'
      },
      {
        col:'c3', type:'Convert',
        instr:'Write as a fraction in simplest form:',
        qtext:'$0.\\overline{4}$',
        hint:'Use the algebraic method for recurring decimals',

/* ── BUILD SLIDES ── */
const wrap = document.getElementById('slideWrap');

DONOWS.forEach((dn, idx) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (idx === 0 ? ' active' : '');
  slide.id = 'dn' + idx;

  const tag = document.createElement('div');
  tag.className = 'lesson-tag';
  tag.textContent = dn.lesson;

  const grid = document.createElement('div');
  grid.className = 'grid';

  dn.cards.forEach((c, ci) => {
    const card = document.createElement('div');
    card.className = 'card ' + c.col + (dn.special ? ' special' : '');

    const sizeClass = c.size ? ' ' + c.size : '';

    if (dn.special) {
      // Beautiful full-card style with topic-label pill
      card.innerHTML = `
        <div class="q-row">
          <div class="q-dot">${ci + 1}</div>
          <div class="q-type">${c.type}</div>
        </div>
        <div class="topic-label">${c.label}</div>
        <div class="q-text${sizeClass}">${c.qtext}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note ? `<div class="ans-note">${c.note}</div>` : ''}
        </div>
      `;
    } else if (c.instr) {
      // Two-part layout: small instruction line + big standalone equation
      card.innerHTML = `
        <div class="q-row">
          <div class="q-dot">${ci + 1}</div>
          <div class="q-type">${c.type}</div>
        </div>
        <div class="q-instr">${c.instr}</div>
        <div class="q-eq">${c.qtext}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note ? `<div class="ans-note">${c.note}</div>` : ''}
        </div>
      `;
    } else {
      card.innerHTML = `
        <div class="q-row">
          <div class="q-dot">${ci + 1}</div>
          <div class="q-type">${c.type}</div>
        </div>
        <div class="q-text${sizeClass}">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint ? `<div class="q-hint">${c.hint}</div>` : ''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note ? `<div class="ans-note">${c.note}</div>` : ''}
        </div>
      `;
    }
    grid.appendChild(card);
  });

  slide.appendChild(tag);
  slide.appendChild(grid);
  wrap.appendChild(slide);
});

/* ── NAV ── */
const slides = document.querySelectorAll('.slide');
const total  = slides.length;
let cur      = 0;
let showing  = false;

const topSub    = document.getElementById('topSub');
const topLesson = document.getElementById('topLesson');
const navInfo   = document.getElementById('navInfo');
const pf        = document.getElementById('pf');
const pb        = document.getElementById('pb');
const nb        = document.getElementById('nb');
const masterBtn = document.getElementById('masterBtn');

function update() {
  slides.forEach((s,i) => s.classList.toggle('active', i===cur));
  topSub.textContent    = `Do Now ${cur+1} of ${total}`;
  topLesson.textContent = DONOWS[cur].lesson;
  navInfo.textContent   = `Do Now ${cur+1} of ${total}`;
  pf.style.width        = ((cur+1)/total*100) + '%';
  pb.disabled = cur===0;
  nb.disabled = cur===total-1;
  nb.textContent = cur===total-1 ? 'Done ✓' : 'Next →';
  // reset answers when changing slide
  hideAll();
  showing = false;
  masterBtn.textContent = 'Show Answers';
  masterBtn.classList.remove('on');
  // Re-render KaTeX for the current slide
  renderMathInElement(document.getElementById('dn'+cur), {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });
}

function hideAll() {
  document.querySelectorAll('.ans-wrap').forEach(el => el.classList.remove('on'));
}

function toggleAnswers() {
  showing = !showing;
  // only toggle current slide's answers
  for(let ci=0; ci<4; ci++) {
    const el = document.getElementById(`a${cur}-${ci}`);
    if(el) el.classList.toggle('on', showing);
  }
  masterBtn.textContent = showing ? 'Hide Answers' : 'Show Answers';
  masterBtn.classList.toggle('on', showing);
  // Re-render KaTeX in answers if showing
  if (showing) {
    renderMathInElement(document.getElementById('dn'+cur), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
}

pb.onclick = () => { if(cur>0){cur--;update();} };
nb.onclick = () => { if(cur<total-1){cur++;update();} };

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<total-1){cur++;update();}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0){cur--;update();}}
});

// Initial render
update();

// Render all KaTeX on page load
document.addEventListener('DOMContentLoaded', function() {
  renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });
});
</script>
