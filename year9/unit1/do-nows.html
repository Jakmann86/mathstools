<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y9 · Rational Numbers · Do Nows</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg:#f0ede8; --navy:#0f2044; --text:#1a1a2e; --muted:#6a6a8a;
    --c1-bg:#dff0ed; --c1-bdr:#9dd4cc; --c1-ink:#0a6b5e;
    --c2-bg:#fdf0dc; --c2-bdr:#f0c472; --c2-ink:#7a4800;
    --c3-bg:#e8e4f8; --c3-bdr:#b8aeed; --c3-ink:#4c2ea8;
    --c4-bg:#fde8e8; --c4-bdr:#f0a8a8; --c4-ink:#9a1f1f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
  .topbar{background:var(--navy);color:white;height:50px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .top-left{display:flex;align-items:center;gap:16px;}
  .top-title{font-family:'DM Serif Display',serif;font-size:1rem;}
  .top-sub{font-size:0.68rem;opacity:0.45;letter-spacing:0.13em;text-transform:uppercase;}
  .toggle-btn{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.28);color:white;border-radius:8px;padding:6px 18px;font-size:0.78rem;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.04em;}
  .toggle-btn:hover{background:rgba(255,255,255,.22);}
  .toggle-btn.on{background:#00b4a0;border-color:#00b4a0;}
  .slides{flex:1;position:relative;overflow:hidden;min-height:0;}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px 20px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .35s;}
  .slide.active{opacity:1;transform:translateY(0);pointer-events:all;}
  .lesson-tag{font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;text-align:center;}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:13px;width:100%;height:100%;max-width:1200px;max-height:640px;margin:0 auto;}
  .card{border-radius:18px;padding:20px 26px;border:2.5px solid;display:flex;flex-direction:column;gap:10px;overflow:hidden;position:relative;}
  .card.c1{background:var(--c1-bg);border-color:var(--c1-bdr);}
  .card.c2{background:var(--c2-bg);border-color:var(--c2-bdr);}
  .card.c3{background:var(--c3-bg);border-color:var(--c3-bdr);}
  .card.c4{background:var(--c4-bg);border-color:var(--c4-bdr);}
  .q-row{display:flex;align-items:center;gap:9px;}
  .q-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.82rem;font-weight:800;color:white;flex-shrink:0;}
  .c1 .q-dot{background:var(--c1-ink);} .c2 .q-dot{background:var(--c2-ink);} .c3 .q-dot{background:var(--c3-ink);} .c4 .q-dot{background:var(--c4-ink);}
  .q-type{font-size:0.62rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;opacity:0.6;}
  .c1 .q-type{color:var(--c1-ink);} .c2 .q-type{color:var(--c2-ink);} .c3 .q-type{color:var(--c3-ink);} .c4 .q-type{color:var(--c4-ink);}
  .q-text{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,3.8vw,3rem);line-height:1.2;flex:1;display:flex;align-items:center;}
  .q-text.sm{font-size:clamp(1.15rem,2.6vw,2rem);} .q-text.med{font-size:clamp(1.3rem,3vw,2.4rem);}
  .c1 .q-text{color:var(--c1-ink);} .c2 .q-text{color:var(--c2-ink);} .c3 .q-text{color:var(--c3-ink);} .c4 .q-text{color:var(--c4-ink);}
  .q-hint{font-size:0.76rem;color:var(--muted);font-style:italic;line-height:1.45;margin-top:-4px;}
  .ans-wrap{display:none !important;flex-direction:column;gap:4px;border-top:2px dashed rgba(0,0,0,0.13);padding-top:10px;margin-top:4px;animation:fadeUp .25s ease both;}
  .ans-wrap.on{display:flex !important;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .ans-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;opacity:0.45;}
  .ans-val{font-family:'DM Serif Display',serif;font-size:clamp(1.1rem,2.6vw,1.9rem);line-height:1.2;}
  .ans-note{font-size:0.74rem;color:var(--muted);line-height:1.45;}
  .c1 .ans-val{color:var(--c1-ink);} .c2 .ans-val{color:var(--c2-ink);} .c3 .ans-val{color:var(--c3-ink);} .c4 .ans-val{color:var(--c4-ink);}
  .q-instr{font-family:'DM Sans',sans-serif;font-size:clamp(0.82rem,1.6vw,1rem);color:var(--muted);line-height:1.4;margin-top:2px;}
  .q-eq{font-family:'DM Serif Display',serif;font-size:clamp(1.5rem,3.2vw,2.6rem);line-height:1.35;flex:1;display:flex;align-items:center;letter-spacing:0.06em;}
  .c1 .q-eq{color:var(--c1-ink);} .c2 .q-eq{color:var(--c2-ink);} .c3 .q-eq{color:var(--c3-ink);} .c4 .q-eq{color:var(--c4-ink);}

  /* BIDMAS tile bank + empty boxes */
  .tile-bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .tile{font-family:'DM Serif Display',serif;font-size:clamp(0.85rem,1.6vw,1.1rem);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;border:2px solid var(--c4-bdr);background:rgba(154,31,31,0.10);color:var(--c4-ink);font-weight:700;flex-shrink:0;}
  .eq-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .eq-box{width:36px;height:36px;border-radius:7px;border:2.5px dashed var(--c4-bdr);background:rgba(154,31,31,0.04);flex-shrink:0;}
  .eq-sep{font-family:'DM Serif Display',serif;font-size:clamp(1rem,2vw,1.3rem);color:var(--c4-ink);font-weight:700;}

  .pbar{height:4px;background:rgba(0,0,0,.08);flex-shrink:0;}
  .pfill{height:100%;background:var(--navy);transition:width .4s;}
  .bnav{height:44px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
  .nav-info{font-size:0.7rem;color:rgba(255,255,255,.38);letter-spacing:0.12em;text-transform:uppercase;}
  .nbtns{display:flex;gap:8px;}
  .nb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;border-radius:7px;padding:6px 18px;font-size:0.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .18s;}
  .nb:hover{background:rgba(255,255,255,.2);} .nb:disabled{opacity:.28;cursor:default;}
  .nb.prim{background:#00b4a0;border-color:#00b4a0;color:var(--navy);font-weight:700;}
  .katex{font-size:0.85em;} .q-text .katex{font-size:0.9em;} .q-text.sm .katex{font-size:0.75em;}
  .q-eq .katex{font-size:1em;} .ans-val .katex{font-size:0.85em;} .ans-note .katex{font-size:0.75em;}
</style>
</head>
<body>
<div class="topbar">
  <div class="top-left">
    <div class="top-title">Y9 · Rational Numbers · Do Nows</div>
    <div class="top-sub" id="topSub">Do Now 1</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="font-size:0.68rem;opacity:.38;color:white;letter-spacing:.1em;text-transform:uppercase" id="topLesson"></div>
    <button class="toggle-btn" id="masterBtn" onclick="toggleAnswers()">Show Answers</button>
  </div>
</div>
<div class="slides" id="slideWrap"></div>
<div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
<div class="bnav">
  <div class="nav-info" id="navInfo"></div>
  <div class="nbtns">
    <button class="nb" id="pb" disabled>← Back</button>
    <button class="nb prim" id="nb">Next →</button>
  </div>
</div>
<script>
const DONOWS = [

  // ── DO NOW 1 · Rational Numbers: Fractions Review ───────────────────
  {
    lesson: 'Rational Numbers · Fractions Review',
    cards: [
      { col:'c1', type:'Classify', qtext:'Write one number that is rational but NOT an integer',
        ans:'e.g. ½, 0.3, −¾', note:'Any fraction or terminating/recurring decimal that is not whole' },
      { col:'c2', type:'Convert', qtext:'Write 0.35 as a fraction in its simplest form',
        ans:'7/20', note:'0.35 = 35/100 · HCF(35,100) = 5 · → 7/20' },
      { col:'c3', type:'Convert', instr:'Write as a fraction in simplest form:',
        qtext:'$0.\\overline{4}$', hint:'Use the algebraic method for recurring decimals',
        ans:'$\\dfrac{4}{9}$', note:'Let x = 0.444… · 10x = 4.444… · 9x = 4 · x = 4/9' },
      { col:'c4', type:'🧩 Puzzle', qtext:'I am a fraction less than 1. My decimal is 0.375. My denominator is 8. What fraction am I?',
        size:'sm', ans:'3/8', note:'0.375 × 8 = 3 · So the fraction is 3/8 · Check: 3÷8 = 0.375 ✓' },
    ]
  },

  // ── DO NOW 2 · Recurring Decimals ───────────────────────────────────
  {
    lesson: 'Rational Numbers · Recurring Decimals',
    cards: [
      { col:'c1', type:'Single Recurring', qtext:'Write $0.\\overline{7}$ &nbsp;as a fraction in simplest form',
        ans:'$\\dfrac{7}{9}$', note:'Let x = 0.777… · 10x = 7.777… · 9x = 7 · x = 7/9' },
      { col:'c2', type:'Double Recurring', qtext:'Write $0.\\overline{36}$ &nbsp;as a fraction in simplest form',
        ans:'$\\dfrac{4}{11}$', note:'Let x = 0.3636… · 100x = 36.3636… · 99x = 36 · x = 36/99 = 4/11' },
      { col:'c3', type:'Mixed Recurring', qtext:'Write $1.\\overline{6}$ &nbsp;as a fraction in simplest form',
        size:'sm', ans:'$\\dfrac{5}{3}$', note:'Let x = 1.666… · 10x = 16.666… · 9x = 15 · x = 15/9 = 5/3' },
      { col:'c4', type:'🧩 Puzzle', qtext:'Calculate $\\dfrac{1}{2} + 0.\\overline{2}$<br>Give your answer as a fraction.',
        size:'sm', ans:'$\\dfrac{13}{18}$', note:'$0.\\overline{2} = \\dfrac{2}{9}$ · $\\dfrac{1}{2} + \\dfrac{2}{9} = \\dfrac{9}{18} + \\dfrac{4}{18} = \\dfrac{13}{18}$' },
    ]
  },

  // ── DO NOW 3 · Mixed Review ─────────────────────────────────────────
  {
    lesson: 'Rational Numbers · Mixed Review',
    cards: [
      { col:'c1', type:'BIDMAS', qtext:'(−14 − 2 × 3) ÷ 5 = ?',
        ans:'−4', note:'−14 − 6 = −20 · −20 ÷ 5 = −4' },
      { col:'c2', type:'Types of Numbers', qtext:'Which of these are rational?<br>√9 &nbsp; π &nbsp; −1.25 &nbsp; √5',
        size:'sm', ans:'√9 and −1.25', note:'√9 = 3 (integer) · −1.25 = −5/4 · π and √5 are irrational' },
      { col:'c3', type:'Simplify', qtext:'Write −0.6 as a fraction in simplest form',
        ans:'−3/5', note:'−0.6 = −6/10 · HCF(6,10) = 2 · −6/10 = −3/5' },
      { col:'c4', type:'🧩 Puzzle', qtext:'Convert 7/40 to a decimal and a percentage.',
        size:'sm', ans:'0.175 and 17.5%', note:'7 ÷ 40 = 0.175 · 0.175 × 100 = 17.5%' },
    ]
  },

  // ── DO NOW 4 · Conversions, Fraction Ops & BIDMAS ───────────────────
  {
    lesson: 'Rational Numbers · Conversions & Operations',
    cards: [
      { col:'c1', type:'Convert', instr:'Write 12% as a fraction in simplest form:',
        qtext:'$12\\%$', ans:'$\\dfrac{3}{25}$', note:'12% = 12/100 · HCF(12,100) = 4 · 12÷4 = 3, 100÷4 = 25' },
      { col:'c2', type:'Fraction Ops', instr:'Simplify first, then calculate:',
        qtext:'$\\dfrac{6}{24} + \\left(-\\dfrac{5}{4}\\right)$',
        ans:'$-1$', note:'6/24 = 1/4 · 1/4 + (−5/4) = 1/4 − 5/4 = −4/4 = −1' },
      { col:'c3', type:'Fraction Ops', instr:'Simplify first, then calculate:',
        qtext:'$\\dfrac{4}{12} \\times \\left(-\\dfrac{28}{20}\\right)$',
        ans:'$-\\dfrac{7}{15}$', note:'4/12 = 1/3 · 28/20 = 7/5 · 1/3 × (−7/5) = −7/15' },
      { col:'c4', type:'🧩 Puzzle', instr:'Use BIDMAS — separate into terms first:',
        qtext:'$\\left(\\dfrac{2}{3}\\right)^{2} + \\left(-\\dfrac{7}{9}\\right) \\times \\dfrac{15}{2}$', size:'sm',
        ans:'$-\\dfrac{97}{18}$', note:'(2/3)² = 4/9 · (−7/9)×(15/2) = −35/6 · LCD=18: 4/9 = 8/18, −35/6 = −105/18 · 8/18 + (−105/18) = −97/18' },
    ]
  },

  // ── DO NOW 5 · Index Laws, Recurring Decimals & BIDMAS ──────────────
  {
    lesson: 'Index Laws, Recurring Decimals & BIDMAS',
    cards: [
      // C1: Single index law — find n
      { col:'c1', type:'Index Laws', instr:'Find the value of $n$:',
        qtext:'$\\dfrac{x^{n}}{x^{5}} = x^{2}$',
        hint:'When dividing same bases, subtract the powers.',
        ans:'$n = 7$',
        note:'xⁿ ÷ x⁵ = xⁿ⁻⁵ · n − 5 = 2 · n = 7' },

      // C2: Fractional equation
      { col:'c2', type:'Equations', instr:'Solve for $x$:',
        qtext:'$\\dfrac{x}{3} + 5 = 11$',
        hint:'Subtract 5 from both sides first, then multiply.',
        ans:'$x = 18$',
        note:'x/3 = 6 · x = 6 × 3 = 18' },

      // C3: Two-dot recurring decimal to fraction
      { col:'c3', type:'Recurring Decimal', instr:'Write as a fraction in simplest form:',
        qtext:'$0.\\dot{1}\\dot{8}$',
        hint:'The dots show the first AND last digit of the repeating block — so 18 repeats.',
        ans:'$\\dfrac{2}{11}$',
        note:'Let x = 0.1818… · 100x = 18.1818… · 99x = 18 · x = 18/99 = 2/11' },

      // C4: BIDMAS puzzle — tiles + empty boxes
      { col:'c4', type:'🧩 BIDMAS Puzzle', bidmas: true,
        ans:'$(2 + 4)^{2} - 9 \\ × \\ 3 = 9$',
        note:'Brackets first: (2+4)² = 36 · then 9×3 = 27 · 36 − 27 = 9 ✓' },
    ]
  },

  // ── DO NOW 6 · Equations with Fractions ─────────────────────────────
  {
    lesson: 'Equations with Fractions',
    cards: [
      { col:'c1', type:'BIDMAS', instr:'Calculate — show each step:',
        qtext:'$(3-7)^2 - \\sqrt[3]{125} + 2^3$',
        ans:'$19$',
        note:'$(3-7)^2 = (-4)^2 = 16$ &ensp; $\\sqrt[3]{125} = 5$ &ensp; $2^3 = 8$ &ensp; $16 - 5 + 8 = 19$' },
      { col:'c2', type:'Solve', instr:'Solve for $x$:',
        qtext:'$\\dfrac{3}{4}x - 2 = 7$',
        hint:'Multiply both sides by the reciprocal of the coefficient.',
        ans:'$x = 12$',
        note:'$\\tfrac{3}{4}x = 9$ &ensp; $x = 9 \\times \\tfrac{4}{3} = 12$' },
      { col:'c3', type:'Collect Like Terms', instr:'Solve for $x$ — collect $x$-terms first:',
        qtext:'$\\dfrac{3}{4}x - 1 = \\dfrac{1}{4}x + 5$',
        hint:'Subtract $\\tfrac{1}{4}x$ from both sides, then solve.',
        ans:'$x = 12$',
        note:'$\\tfrac{3}{4}x - \\tfrac{1}{4}x = 5 + 1$ &ensp; $\\tfrac{1}{2}x = 6$ &ensp; $x = 12$' },
      { col:'c4', type:'🧩 Expand & Solve', instr:'Expand the bracket, collect like terms, solve:',
        qtext:'$\\tfrac{2}{3}(3x + 6) - \\tfrac{1}{2}x = x + 5$',
        hint:'Expand first: $\\tfrac{2}{3} \\times 3x + \\tfrac{2}{3} \\times 6$',
        ans:'$x = 2$',
        note:'$2x + 4 - \\tfrac{1}{2}x = x + 5$ &ensp; $\\tfrac{3}{2}x + 4 = x + 5$ &ensp; $\\tfrac{1}{2}x = 1$ &ensp; $x = 2$' },
    ]
  },

];

const wrap = document.getElementById('slideWrap');
DONOWS.forEach((dn, idx) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (idx===0?' active':'');
  slide.id = 'dn'+idx;
  const tag = document.createElement('div');
  tag.className = 'lesson-tag';
  tag.textContent = dn.lesson;
  const grid = document.createElement('div');
  grid.className = 'grid';

  dn.cards.forEach((c, ci) => {
    const card = document.createElement('div');
    card.className = 'card '+c.col;
    const sizeClass = c.size?' '+c.size:'';

    if (c.bidmas) {
      // BIDMAS puzzle: number tiles above, fixed equation with empty boxes below
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="color:var(--c4-ink);font-weight:600;font-size:clamp(0.78rem,1.5vw,0.95rem);">
          Place each number card to make the equation equal <span style="font-family:'DM Serif Display',serif;font-size:1.3em;">9</span>
        </div>
        <div class="tile-bank">
          <span class="tile">2</span>
          <span class="tile">3</span>
          <span class="tile">4</span>
          <span class="tile">9</span>
        </div>
        <div class="eq-row">
          <span class="eq-sep">(</span>
          <span class="eq-box"></span>
          <span class="eq-sep">+</span>
          <span class="eq-box"></span>
          <span class="eq-sep">)<sup style="font-size:0.7em">2</sup> −</span>
          <span class="eq-box"></span>
          <span class="eq-sep">×</span>
          <span class="eq-box"></span>
          <span class="eq-sep">= 9</span>
        </div>
        <div class="q-hint">Remember: brackets and powers before multiply before subtract</div>
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">$(2 + 4)^{2} - 9 \\times 3 = 9$</div>
          <div class="ans-note">Brackets: $(2+4)^2 = 36$ &ensp;·&ensp; $9 \\times 3 = 27$ &ensp;·&ensp; $36 - 27 = 9$ ✓</div>
        </div>`;
    } else if(c.instr){
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">${c.instr}</div>
        <div class="q-eq">${c.qtext}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-text${sizeClass}">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    }
    grid.appendChild(card);
  });

  slide.appendChild(tag); slide.appendChild(grid); wrap.appendChild(slide);
});

const slides=document.querySelectorAll('.slide'),total=slides.length;
let cur=0,showing=false;
const topSub=document.getElementById('topSub'),topLesson=document.getElementById('topLesson'),
      navInfo=document.getElementById('navInfo'),pf=document.getElementById('pf'),
      pb=document.getElementById('pb'),nb=document.getElementById('nb'),
      masterBtn=document.getElementById('masterBtn');

function renderSlide(i){
  renderMathInElement(document.getElementById('dn'+i),{
    delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false
  });
}

function update(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  topSub.textContent=`Do Now ${cur+1} of ${total}`;
  topLesson.textContent=DONOWS[cur].lesson;
  navInfo.textContent=`Do Now ${cur+1} of ${total}`;
  pf.style.width=((cur+1)/total*100)+'%';
  pb.disabled=cur===0; nb.disabled=cur===total-1;
  nb.textContent=cur===total-1?'Done ✓':'Next →';
  hideAll(); showing=false;
  masterBtn.textContent='Show Answers'; masterBtn.classList.remove('on');
  renderSlide(cur);
}
function hideAll(){document.querySelectorAll('.ans-wrap').forEach(el=>el.classList.remove('on'));}
function toggleAnswers(){
  showing=!showing;
  for(let ci=0;ci<4;ci++){const el=document.getElementById(`a${cur}-${ci}`);if(el)el.classList.toggle('on',showing);}
  masterBtn.textContent=showing?'Hide Answers':'Show Answers';
  masterBtn.classList.toggle('on',showing);
  if(showing) renderSlide(cur);
}
pb.onclick=()=>{if(cur>0){cur--;update();}};
nb.onclick=()=>{if(cur<total-1){cur++;update();}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<total-1){cur++;update();}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0){cur--;update();}}
});
update();
</script>
</body>
</html>
