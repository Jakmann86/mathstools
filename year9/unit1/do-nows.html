<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y9 · Unit 1 · Do Nows · Complete</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg:#f0ede8; --navy:#0f2044; --text:#111122; --muted:#3e3e5c;
    --c1-bg:#dff0ed; --c1-bdr:#7ac4b8; --c1-ink:#043d35;
    --c2-bg:#fdf0dc; --c2-bdr:#dba840; --c2-ink:#422400;
    --c3-bg:#e8e4f8; --c3-bdr:#9688dd; --c3-ink:#2a1660;
    --c4-bg:#fde8e8; --c4-bdr:#e08080; --c4-ink:#5c1010;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
  .topbar{background:var(--navy);color:white;height:54px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .top-left{display:flex;align-items:center;gap:16px;}
  .top-title{font-family:'DM Serif Display',serif;font-size:1.15rem;}
  .top-sub{font-size:0.78rem;opacity:0.5;letter-spacing:0.13em;text-transform:uppercase;}
  .toggle-btn{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.28);color:white;border-radius:8px;padding:7px 20px;font-size:0.88rem;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.04em;}
  .toggle-btn:hover{background:rgba(255,255,255,.22);}
  .toggle-btn.on{background:#00b4a0;border-color:#00b4a0;}
  .slides{flex:1;position:relative;overflow:hidden;min-height:0;}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 20px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .35s;overflow-y:auto;}
  .slide.active{opacity:1;transform:translateY(0);pointer-events:all;}
  .lesson-tag{font-size:0.78rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:10px;text-align:center;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:14px;width:100%;max-width:1200px;min-height:min(100%,660px);margin:0 auto;padding-bottom:10px;}
  .card{border-radius:18px;padding:22px 28px;border:2.5px solid;display:flex;flex-direction:column;gap:10px;overflow:visible;position:relative;}
  .card.c1{background:var(--c1-bg);border-color:var(--c1-bdr);}
  .card.c2{background:var(--c2-bg);border-color:var(--c2-bdr);}
  .card.c3{background:var(--c3-bg);border-color:var(--c3-bdr);}
  .card.c4{background:var(--c4-bg);border-color:var(--c4-bdr);}
  .q-row{display:flex;align-items:center;gap:10px;}
  .q-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;font-weight:800;color:white;flex-shrink:0;}
  .c1 .q-dot{background:var(--c1-ink);} .c2 .q-dot{background:var(--c2-ink);} .c3 .q-dot{background:var(--c3-ink);} .c4 .q-dot{background:var(--c4-ink);}
  .q-type{font-size:0.78rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:0.75;}
  .c1 .q-type{color:var(--c1-ink);} .c2 .q-type{color:var(--c2-ink);} .c3 .q-type{color:var(--c3-ink);} .c4 .q-type{color:var(--c4-ink);}
  .q-text{font-family:'DM Serif Display',serif;font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.2;flex:1;display:flex;align-items:center;}
  .q-text.sm{font-size:clamp(1.5rem,3.2vw,2.5rem);} .q-text.med{font-size:clamp(1.7rem,3.6vw,2.8rem);}
  .c1 .q-text{color:var(--c1-ink);} .c2 .q-text{color:var(--c2-ink);} .c3 .q-text{color:var(--c3-ink);} .c4 .q-text{color:var(--c4-ink);}
  .q-hint{font-size:0.92rem;color:var(--muted);font-style:italic;line-height:1.45;margin-top:-4px;}
  .q-instr{font-family:'DM Sans',sans-serif;font-size:clamp(1rem,1.8vw,1.2rem);color:var(--muted);font-weight:500;line-height:1.4;margin-top:2px;}
  .q-eq{font-family:'DM Serif Display',serif;font-size:clamp(1.9rem,3.8vw,3.2rem);line-height:1.35;flex:1;display:flex;align-items:center;letter-spacing:0.04em;}
  .q-eq.sm{font-size:clamp(1.3rem,2.6vw,2rem);}
  .q-eq.med{font-size:clamp(1.5rem,3vw,2.4rem);}
  .c1 .q-eq{color:var(--c1-ink);} .c2 .q-eq{color:var(--c2-ink);} .c3 .q-eq{color:var(--c3-ink);} .c4 .q-eq{color:var(--c4-ink);}
  .ans-wrap{display:none !important;flex-direction:column;gap:5px;border-top:2.5px dashed rgba(0,0,0,0.18);padding-top:10px;margin-top:4px;animation:fadeUp .25s ease both;}
  .ans-wrap.on{display:flex !important;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .ans-lbl{font-size:0.72rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;opacity:0.55;}
  .ans-val{font-family:'DM Serif Display',serif;font-size:clamp(1.4rem,3vw,2.3rem);line-height:1.2;}
  .ans-note{font-size:0.9rem;color:var(--muted);line-height:1.45;}
  .c1 .ans-val{color:var(--c1-ink);} .c2 .ans-val{color:var(--c2-ink);} .c3 .ans-val{color:var(--c3-ink);} .c4 .ans-val{color:var(--c4-ink);}

  /* BIDMAS tile bank + empty boxes */
  .tile-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .tile{font-family:'DM Serif Display',serif;font-size:clamp(1rem,1.8vw,1.3rem);width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid var(--c4-bdr);background:rgba(92,16,16,0.10);color:var(--c4-ink);font-weight:700;flex-shrink:0;}
  .eq-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .eq-box{width:42px;height:42px;border-radius:8px;border:2.5px dashed var(--c4-bdr);background:rgba(92,16,16,0.04);flex-shrink:0;}
  .eq-sep{font-family:'DM Serif Display',serif;font-size:clamp(1.2rem,2.4vw,1.6rem);color:var(--c4-ink);font-weight:700;}

  .pbar{height:4px;background:rgba(0,0,0,.08);flex-shrink:0;}
  .pfill{height:100%;background:var(--navy);transition:width .4s;}
  .bnav{height:46px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;}
  .nav-info{font-size:0.8rem;color:rgba(255,255,255,.45);letter-spacing:0.12em;text-transform:uppercase;}
  .nbtns{display:flex;gap:8px;}
  .nb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;border-radius:7px;padding:7px 20px;font-size:0.88rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .18s;}
  .nb:hover{background:rgba(255,255,255,.2);} .nb:disabled{opacity:.28;cursor:default;}
  .nb.prim{background:#00b4a0;border-color:#00b4a0;color:var(--navy);font-weight:700;}
  .katex{font-size:1em;} .q-text .katex{font-size:1em;} .q-text.sm .katex{font-size:0.9em;}
  .q-eq .katex{font-size:1.1em;} .ans-val .katex{font-size:0.95em;} .ans-note .katex{font-size:0.82em;}
</style>
</head>
<body>
<div class="topbar">
  <div class="top-left">
    <div class="top-title">Y9 · Unit 1 · Do Nows</div>
    <div class="top-sub" id="topSub">Do Now 1</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <div style="font-size:0.72rem;opacity:.42;color:white;letter-spacing:.1em;text-transform:uppercase" id="topLesson"></div>
    <button class="toggle-btn" id="masterBtn" onclick="toggleAnswers()">Show Answers</button>
  </div>
</div>
<div class="slides" id="slideWrap"></div>
<div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
<div class="bnav">
  <div class="nav-info" id="navInfo"></div>
  <div class="nbtns">
    <button class="nb" id="pb" disabled>← Back</button>
    <button class="nb prim" id="nb">Next →</button>
  </div>
</div>
<script>
const DONOWS = [

  // ═══════════════════════════════════════════════════════════════════
  //  RATIONAL NUMBERS BLOCK (original Do Nows 1–6)
  // ═══════════════════════════════════════════════════════════════════

  // ── DO NOW 1 · Fractions Review ─────────────────────────────────────
  {
    lesson: 'Rational Numbers · Fractions Review',
    cards: [
      { col:'c1', type:'Classify', qtext:'Write one number that is rational but NOT an integer',
        ans:'e.g. ½, 0.3, −¾', note:'Any fraction or terminating/recurring decimal that is not whole' },
      { col:'c2', type:'Convert', qtext:'Write 0.35 as a fraction in its simplest form',
        ans:'7/20', note:'0.35 = 35/100 · HCF(35,100) = 5 · → 7/20' },
      { col:'c3', type:'Convert', instr:'Write as a fraction in simplest form:',
        qtext:'$0.\\overline{4}$', hint:'Use the algebraic method for recurring decimals',
        ans:'$\\dfrac{4}{9}$', note:'Let x = 0.444… · 10x = 4.444… · 9x = 4 · x = 4/9' },
      { col:'c4', type:'🧩 Puzzle', qtext:'I am a fraction less than 1. My decimal is 0.375. My denominator is 8. What fraction am I?',
        size:'sm', ans:'3/8', note:'0.375 × 8 = 3 · So the fraction is 3/8 · Check: 3÷8 = 0.375 ✓' },
    ]
  },

  // ── DO NOW 2 · Recurring Decimals ───────────────────────────────────
  {
    lesson: 'Rational Numbers · Recurring Decimals',
    cards: [
      { col:'c1', type:'Single Recurring', qtext:'Write $0.\\overline{7}$ &nbsp;as a fraction in simplest form',
        ans:'$\\dfrac{7}{9}$', note:'Let x = 0.777… · 10x = 7.777… · 9x = 7 · x = 7/9' },
      { col:'c2', type:'Double Recurring', qtext:'Write $0.\\overline{36}$ &nbsp;as a fraction in simplest form',
        ans:'$\\dfrac{4}{11}$', note:'Let x = 0.3636… · 100x = 36.3636… · 99x = 36 · x = 36/99 = 4/11' },
      { col:'c3', type:'Mixed Recurring', qtext:'Write $1.\\overline{6}$ &nbsp;as a fraction in simplest form',
        size:'sm', ans:'$\\dfrac{5}{3}$', note:'Let x = 1.666… · 10x = 16.666… · 9x = 15 · x = 15/9 = 5/3' },
      { col:'c4', type:'🧩 Puzzle', qtext:'Calculate $\\dfrac{1}{2} + 0.\\overline{2}$<br>Give your answer as a fraction.',
        size:'sm', ans:'$\\dfrac{13}{18}$', note:'$0.\\overline{2} = \\dfrac{2}{9}$ · $\\dfrac{1}{2} + \\dfrac{2}{9} = \\dfrac{9}{18} + \\dfrac{4}{18} = \\dfrac{13}{18}$' },
    ]
  },

  // ── DO NOW 3 · Mixed Review ─────────────────────────────────────────
  {
    lesson: 'Rational Numbers · Mixed Review',
    cards: [
      { col:'c1', type:'BIDMAS', qtext:'(−14 − 2 × 3) ÷ 5 = ?',
        ans:'−4', note:'−14 − 6 = −20 · −20 ÷ 5 = −4' },
      { col:'c2', type:'Types of Numbers', qtext:'Which of these are rational?<br>√9 &nbsp; π &nbsp; −1.25 &nbsp; √5',
        size:'sm', ans:'√9 and −1.25', note:'√9 = 3 (integer) · −1.25 = −5/4 · π and √5 are irrational' },
      { col:'c3', type:'Simplify', qtext:'Write −0.6 as a fraction in simplest form',
        ans:'−3/5', note:'−0.6 = −6/10 · HCF(6,10) = 2 · −6/10 = −3/5' },
      { col:'c4', type:'🧩 Puzzle', qtext:'Convert 7/40 to a decimal and a percentage.',
        size:'sm', ans:'0.175 and 17.5%', note:'7 ÷ 40 = 0.175 · 0.175 × 100 = 17.5%' },
    ]
  },

  // ── DO NOW 4 · Conversions & Operations ─────────────────────────────
  {
    lesson: 'Rational Numbers · Conversions & Operations',
    cards: [
      { col:'c1', type:'Convert', instr:'Write 12% as a fraction in simplest form:',
        qtext:'$12\\%$', ans:'$\\dfrac{3}{25}$', note:'12% = 12/100 · HCF(12,100) = 4 · 12÷4 = 3, 100÷4 = 25' },
      { col:'c2', type:'Fraction Ops', instr:'Simplify first, then calculate:',
        qtext:'$\\dfrac{6}{24} + \\left(-\\dfrac{5}{4}\\right)$',
        ans:'$-1$', note:'6/24 = 1/4 · 1/4 + (−5/4) = 1/4 − 5/4 = −4/4 = −1' },
      { col:'c3', type:'Fraction Ops', instr:'Simplify first, then calculate:',
        qtext:'$\\dfrac{4}{12} \\times \\left(-\\dfrac{28}{20}\\right)$',
        ans:'$-\\dfrac{7}{15}$', note:'4/12 = 1/3 · 28/20 = 7/5 · 1/3 × (−7/5) = −7/15' },
      { col:'c4', type:'🧩 Puzzle', instr:'Use BIDMAS — separate into terms first:',
        qtext:'$\\left(\\dfrac{2}{3}\\right)^{2} + \\left(-\\dfrac{7}{9}\\right) \\times \\dfrac{15}{2}$', size:'sm',
        ans:'$-\\dfrac{97}{18}$', note:'(2/3)² = 4/9 · (−7/9)×(15/2) = −35/6 · LCD=18 → −97/18' },
    ]
  },

  // ── DO NOW 5 · Index Laws, Recurring Decimals & BIDMAS ──────────────
  {
    lesson: 'Index Laws, Recurring Decimals & BIDMAS',
    cards: [
      { col:'c1', type:'Index Laws', instr:'Find the value of $n$:',
        qtext:'$\\dfrac{x^{n}}{x^{5}} = x^{2}$',
        hint:'When dividing same bases, subtract the powers.',
        ans:'$n = 7$', note:'xⁿ ÷ x⁵ = xⁿ⁻⁵ · n − 5 = 2 · n = 7' },
      { col:'c2', type:'Equations', instr:'Solve for $x$:',
        qtext:'$\\dfrac{x}{3} + 5 = 11$',
        hint:'Subtract 5 from both sides first, then multiply.',
        ans:'$x = 18$', note:'x/3 = 6 · x = 6 × 3 = 18' },
      { col:'c3', type:'Recurring Decimal', instr:'Write as a fraction in simplest form:',
        qtext:'$0.\\dot{1}\\dot{8}$',
        hint:'The dots show the first AND last digit of the repeating block — so 18 repeats.',
        ans:'$\\dfrac{2}{11}$', note:'Let x = 0.1818… · 100x = 18.1818… · 99x = 18 · x = 18/99 = 2/11' },
      { col:'c4', type:'🧩 BIDMAS Puzzle', bidmas: true,
        ans:'$(2 + 4)^{2} - 9 \\times 3 = 9$',
        note:'Brackets: $(2+4)^2 = 36$ · $9 \\times 3 = 27$ · $36 - 27 = 9$ ✓' },
    ]
  },

  // ── DO NOW 6 · Equations with Fractions ─────────────────────────────
  {
    lesson: 'Equations with Fractions',
    cards: [
      { col:'c1', type:'BIDMAS', instr:'Calculate — show each step:',
        qtext:'$(3-7)^2 - \\sqrt[3]{125} + 2^3$',
        ans:'$19$', note:'$(3-7)^2 = (-4)^2 = 16$ · $\\sqrt[3]{125} = 5$ · $2^3 = 8$ · $16 - 5 + 8 = 19$' },
      { col:'c2', type:'Solve', instr:'Solve for $x$:',
        qtext:'$\\dfrac{3}{4}x - 2 = 7$',
        hint:'Multiply both sides by the reciprocal of the coefficient.',
        ans:'$x = 12$', note:'$\\tfrac{3}{4}x = 9$ · $x = 9 \\times \\tfrac{4}{3} = 12$' },
      { col:'c3', type:'Collect Like Terms', instr:'Solve for $x$ — collect $x$-terms first:',
        qtext:'$\\dfrac{3}{4}x - 1 = \\dfrac{1}{4}x + 5$',
        hint:'Subtract $\\tfrac{1}{4}x$ from both sides, then solve.',
        ans:'$x = 12$', note:'$\\tfrac{3}{4}x - \\tfrac{1}{4}x = 5 + 1$ · $\\tfrac{1}{2}x = 6$ · $x = 12$' },
      { col:'c4', type:'🧩 Expand & Solve', instr:'Expand the bracket, collect like terms, solve:',
        qtext:'$\\tfrac{2}{3}(3x + 6) - \\tfrac{1}{2}x = x + 5$',
        hint:'Expand first: $\\tfrac{2}{3} \\times 3x + \\tfrac{2}{3} \\times 6$',
        ans:'$x = 2$', note:'$2x + 4 - \\tfrac{1}{2}x = x + 5$ · $\\tfrac{3}{2}x + 4 = x + 5$ · $\\tfrac{1}{2}x = 1$ · $x = 2$' },
    ]
  },

  // ═══════════════════════════════════════════════════════════════════
  //  BASIC INDICES BLOCK (Do Nows 7–10)
  // ═══════════════════════════════════════════════════════════════════

  // ── DO NOW 7 · Product & Quotient Rules ─────────────────────────────
  {
    lesson: 'Index Laws · Product & Quotient',
    cards: [
      { col:'c1', type:'Product Rule', instr:'Simplify — write as a single power:',
        qtext:'$a^{3} \\times a^{5}$',
        hint:'When multiplying same bases, what happens to the powers?',
        ans:'$a^{8}$', note:'Same base → add the exponents: 3 + 5 = 8' },
      { col:'c2', type:'Quotient Rule', instr:'Simplify — write as a single power:',
        qtext:'$m^{10} \\div m^{4}$',
        hint:'When dividing same bases, what happens to the powers?',
        ans:'$m^{6}$', note:'Same base → subtract the exponents: 10 − 4 = 6' },
      { col:'c3', type:'Combined', instr:'Simplify — write as a single power:',
        qtext:'$\\dfrac{x^{7} \\times x^{3}}{x^{2}}$', size:'sm',
        hint:'Simplify the top first, then divide.',
        ans:'$x^{8}$', note:'Top: 7 + 3 = 10 · Then 10 − 2 = 8' },
      { col:'c4', type:'🧩 Find the Missing Power', instr:'Find the value of $n$:',
        qtext:'$p^{n} \\times p^{4} = p^{11}$',
        hint:'What number added to 4 gives 11?',
        ans:'$n = 7$', note:'n + 4 = 11 · n = 7' },
    ]
  },

  // ── DO NOW 8 · Power of a Power & Zero Exponent ─────────────────────
  {
    lesson: 'Index Laws · Power of a Power & Zero Exponent',
    cards: [
      { col:'c1', type:'Power of a Power', instr:'Simplify — write as a single power:',
        qtext:'$(y^{4})^{3}$',
        hint:'When raising a power to a power, what do you do?',
        ans:'$y^{12}$', note:'Multiply the exponents: 4 × 3 = 12' },
      { col:'c2', type:'Zero Exponent', qtext:'Evaluate $7^{0}$',
        hint:'Think about the pattern: 7³ = 343, 7² = 49, 7¹ = 7, 7⁰ = ?',
        ans:'$1$', note:'Any non-zero base to the power 0 equals 1' },
      { col:'c3', type:'Combined', instr:'Simplify:',
        qtext:'$(k^{5})^{2} \\div k^{3}$', size:'sm',
        hint:'Deal with the bracket first, then divide.',
        ans:'$k^{7}$', note:'$(k^5)^2 = k^{10}$ · then $k^{10} \\div k^{3} = k^{7}$' },
      { col:'c4', type:'🧩 True or False?', qtext:'$5^{0} + 3^{0} = 8^{0}$', size:'med',
        hint:'Work out each side separately.',
        ans:'False', note:'LHS: 5⁰ + 3⁰ = 1 + 1 = 2 · RHS: 8⁰ = 1 · 2 ≠ 1' },
    ]
  },

  // ── DO NOW 9 · Mixed Index Laws ─────────────────────────────────────
  {
    lesson: 'Index Laws · Mixed Practice',
    cards: [
      { col:'c1', type:'Evaluate', qtext:'$2^{3} \\times 2^{2}$',
        hint:'Simplify using the product rule, then evaluate.',
        ans:'$32$', note:'$2^{3} \\times 2^{2} = 2^{5} = 32$' },
      { col:'c2', type:'Find the Error', instr:'Amir wrote: &ensp;$(x^{3})^{4} = x^{7}$',
        qtext:'What is wrong?', size:'sm',
        hint:'Should you add or multiply the exponents here?',
        ans:'Should be $x^{12}$', note:'Power of a power → multiply: 3 × 4 = 12, not add' },
      { col:'c3', type:'Simplify', instr:'Write as a single power of 3:',
        qtext:'$\\dfrac{3^{8}}{3^{5} \\times 3}$', size:'sm',
        hint:'Remember: 3 = 3¹',
        ans:'$3^{2}$', note:'Bottom: $3^5 \\times 3^1 = 3^{6}$ · then $3^{8} \\div 3^{6} = 3^{2}$' },
      { col:'c4', type:'🧩 Puzzle', instr:'Find the value of $n$:',
        qtext:'$(2^{n})^{3} = 2^{12}$',
        hint:'If multiplying by 3 gives 12…',
        ans:'$n = 4$', note:'n × 3 = 12 · n = 4' },
    ]
  },

  // ── DO NOW 10 · Problem Solving with Indices ────────────────────────
  {
    lesson: 'Index Laws · Problem Solving',
    cards: [
      { col:'c1', type:'Evaluate', instr:'Work out — give a numerical answer:',
        qtext:'$\\dfrac{5^{6}}{5^{4}}$',
        ans:'$25$', note:'$5^{6} \\div 5^{4} = 5^{2} = 25$' },
      { col:'c2', type:'Simplify', instr:'Simplify fully:',
        qtext:'$\\dfrac{a^{3} \\times a^{5}}{(a^{2})^{3}}$', size:'sm',
        hint:'Simplify top and bottom separately first.',
        ans:'$a^{2}$', note:'Top: $a^{8}$ · Bottom: $a^{6}$ · $a^{8} \\div a^{6} = a^{2}$' },
      { col:'c3', type:'Write as a Power', instr:'Write 64 as a power of 2:',
        qtext:'$64 = 2^{\\,?}$',
        hint:'Keep halving: 64, 32, 16, 8, 4, 2 …',
        ans:'$2^{6}$', note:'2 × 2 × 2 × 2 × 2 × 2 = 64' },
      { col:'c4', type:'🧩 Puzzle', instr:'A cell divides in two every hour. You start with one cell.',
        qtext:'How many cells after 10 hours?<br>Write as a power, then evaluate.', size:'sm',
        hint:'Each hour the number doubles…',
        ans:'$2^{10} = 1024$', note:'After n hours: $2^{n}$ cells · $2^{10} = 1024$' },
    ]
  },

  // ═══════════════════════════════════════════════════════════════════
  //  COEFFICIENTS & HARDER INDICES (Do Now 11)
  // ═══════════════════════════════════════════════════════════════════

  // ── DO NOW 11 · Coefficients, Brackets, Negative & Fractional ───────
  {

        ans:'$11 + 3\\sqrt{15}$', note:'$\\sqrt{5} \\cdot \\sqrt{5} = 5$ · $\\sqrt{5} \\cdot 2\\sqrt{3} = 2\\sqrt{15}$ · $\\sqrt{3} \\cdot \\sqrt{5} = \\sqrt{15}$ · $\\sqrt{3} \\cdot 2\\sqrt{3} = 6$ · $5 + 3\\sqrt{15} + 6$' },
      { col:'c3', type:'Simultaneous Equations', instr:'Solve:',
        qtext:'$2x + y = 7$<br>$x - y = 2$', size:'sm',
        hint:'Look at the $y$ terms — what happens if you add the equations?',
        ans:'$x = 3, \\; y = 1$', note:'Add: $3x = 9$ · $x = 3$ · Sub back: $3 - y = 2$ · $y = 1$' },
      { col:'c4', type:'🧩 Rationalise', instr:'Rationalise the denominator. Simplify fully.',
        qtext:'$\\dfrac{6}{\\sqrt{7} - 1}$',
        hint:'Multiply top and bottom by the conjugate: $\\sqrt{7} + 1$.',
        ans:'$\\sqrt{7} + 1$', note:'$\\dfrac{6(\\sqrt{7}+1)}{(\\sqrt{7})^2 - 1^2} = \\dfrac{6(\\sqrt{7}+1)}{6} = \\sqrt{7} + 1$' },
    ]
  },

];

// ═══════════════════════════════════════════════════════════════════
//  BUILD SLIDES
// ═══════════════════════════════════════════════════════════════════

const wrap = document.getElementById('slideWrap');
DONOWS.forEach((dn, idx) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (idx===0?' active':'');
  slide.id = 'dn'+idx;
  const tag = document.createElement('div');
  tag.className = 'lesson-tag';
  tag.textContent = dn.lesson;
  const grid = document.createElement('div');
  grid.className = 'grid';

  dn.cards.forEach((c, ci) => {
    const card = document.createElement('div');
    card.className = 'card '+c.col;
    const sizeClass = c.size?' '+c.size:'';

    if (c.bidmas) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="color:var(--c4-ink);font-weight:600;font-size:clamp(0.9rem,1.6vw,1.1rem);">
          Place each number card to make the equation equal <span style="font-family:'DM Serif Display',serif;font-size:1.3em;">9</span>
        </div>
        <div class="tile-bank">
          <span class="tile">2</span>
          <span class="tile">3</span>
          <span class="tile">4</span>
          <span class="tile">9</span>
        </div>
        <div class="eq-row">
          <span class="eq-sep">(</span>
          <span class="eq-box"></span>
          <span class="eq-sep">+</span>
          <span class="eq-box"></span>
          <span class="eq-sep">)<sup style="font-size:0.7em">2</sup> −</span>
          <span class="eq-box"></span>
          <span class="eq-sep">×</span>
          <span class="eq-box"></span>
          <span class="eq-sep">= 9</span>
        </div>
        <div class="q-hint">Remember: brackets and powers before multiply before subtract</div>
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">$(2 + 4)^{2} - 9 \\times 3 = 9$</div>
          <div class="ans-note">Brackets: $(2+4)^2 = 36$ · $9 \\times 3 = 27$ · $36 - 27 = 9$ ✓</div>
        </div>`;
    } else if (c.bidmas2) {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr" style="color:var(--c4-ink);font-weight:600;font-size:clamp(0.9rem,1.6vw,1.1rem);">
          Place each number tile once to make the equation true:
        </div>
        <div class="tile-bank" style="gap:12px;margin-top:6px;">
          <span class="tile" style="width:48px;height:48px;font-size:clamp(1.2rem,2.4vw,1.6rem);">3</span>
          <span class="tile" style="width:48px;height:48px;font-size:clamp(1.2rem,2.4vw,1.6rem);">4</span>
          <span class="tile" style="width:48px;height:48px;font-size:clamp(1.2rem,2.4vw,1.6rem);">5</span>
          <span class="tile" style="width:48px;height:48px;font-size:clamp(1.2rem,2.4vw,1.6rem);">7</span>
        </div>
        <div class="eq-row" style="gap:8px;margin-top:10px;flex:1;align-items:center;">
          <span class="eq-box" style="width:48px;height:48px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.4rem,3vw,2.2rem);">×</span>
          <span class="eq-box" style="width:48px;height:48px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.4rem,3vw,2.2rem);">−</span>
          <span class="eq-box" style="width:48px;height:48px;"></span>
          <span class="eq-sep" style="font-size:clamp(1.4rem,3vw,2.2rem);"><sup style="font-size:0.6em">2</sup> =</span>
          <span class="eq-box" style="width:48px;height:48px;"></span>
        </div>
        <div class="q-hint">Powers before multiplication before subtraction.</div>
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          <div class="ans-note">${c.note}</div>
        </div>`;
    } else if(c.instr){
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-instr">${c.instr}</div>
        <div class="q-eq${sizeClass}">${c.qtext}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="q-row"><div class="q-dot">${ci+1}</div><div class="q-type">${c.type}</div></div>
        <div class="q-text${sizeClass}">${c.qtext.replace(/\n/g,'<br>')}</div>
        ${c.hint?`<div class="q-hint">${c.hint}</div>`:''}
        <div class="ans-wrap" id="a${idx}-${ci}">
          <div class="ans-lbl">Answer</div>
          <div class="ans-val">${c.ans}</div>
          ${c.note?`<div class="ans-note">${c.note}</div>`:''}
        </div>`;
    }
    grid.appendChild(card);
  });

  slide.appendChild(tag); slide.appendChild(grid); wrap.appendChild(slide);
});

const slides=document.querySelectorAll('.slide'),total=slides.length;
let cur=0,showing=false;
const topSub=document.getElementById('topSub'),topLesson=document.getElementById('topLesson'),
      navInfo=document.getElementById('navInfo'),pf=document.getElementById('pf'),
      pb=document.getElementById('pb'),nb=document.getElementById('nb'),
      masterBtn=document.getElementById('masterBtn');

function renderSlide(i){
  renderMathInElement(document.getElementById('dn'+i),{
    delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false
  });
}

function update(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  topSub.textContent=`Do Now ${cur+1} of ${total}`;
  topLesson.textContent=DONOWS[cur].lesson;
  navInfo.textContent=`Do Now ${cur+1} of ${total}`;
  pf.style.width=((cur+1)/total*100)+'%';
  pb.disabled=cur===0; nb.disabled=cur===total-1;
  nb.textContent=cur===total-1?'Done ✓':'Next →';
  hideAll(); showing=false;
  masterBtn.textContent='Show Answers'; masterBtn.classList.remove('on');
  renderSlide(cur);
}
function hideAll(){document.querySelectorAll('.ans-wrap').forEach(el=>el.classList.remove('on'));}
function toggleAnswers(){
  showing=!showing;
  for(let ci=0;ci<4;ci++){const el=document.getElementById(`a${cur}-${ci}`);if(el)el.classList.toggle('on',showing);}
  masterBtn.textContent=showing?'Hide Answers':'Show Answers';
  masterBtn.classList.toggle('on',showing);
  if(showing) renderSlide(cur);
}
pb.onclick=()=>{if(cur>0){cur--;update();}};
nb.onclick=()=>{if(cur<total-1){cur++;update();}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<total-1){cur++;update();}}
  if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0){cur--;update();}}
});
update();
</script>
</body>
</html>
